name-template: 'Config PrevTag $RESOLVED_VERSION'
tag-template: 'cprev-$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER, @$AUTHOR)'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'

template: |
  ## Changes

  $CHANGES