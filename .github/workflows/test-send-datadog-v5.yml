# POC ONLY: run the MERGED send-datadog-deployment-event v5 code (platform-core #1912,
# commit d5936f2ce) and check the Slack text + Compare links, WITHOUT any Datadog/Slack call.
#
# No-publish guarantees:
#   1. Triggers only on manual dispatch or a push to this test branch (never main/PR/schedule).
#   2. Uses a local copy of the action (.github/actions/send-datadog-deployment-event-v5) whose
#      ONLY change is that the final masci/datadog send step is replaced by writing the text to a file.
#      There is no step that can make a Datadog or Slack request.
#   3. No `secrets.*` anywhere; the API key is a dummy literal.
#   4. contents: read only.
name: test-send-datadog-v5 (no publish)

on:
  workflow_dispatch:
  push:
    branches: [test-send-datadog-v5-no-publish]
    paths:
      - .github/workflows/test-send-datadog-v5.yml
      - .github/actions/send-datadog-deployment-event-v5/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # expect: substring that MUST be in the text; forbid: substring that must NOT be
          - { name: int-pre-single-region,    event: pre-deployment,  alert: info,    env: int,   prev: single,  expect: '[Compare changes](', forbid: 'Monitor' }
          - { name: int-post-success,         event: post-deployment, alert: success, env: int,   prev: single,  expect: '[Rollback](',        forbid: 'Release notes' }
          - { name: stage-multi-region,       event: pre-deployment,  alert: info,    env: stage, prev: multi,   expect: '[Compare (eu-west-1)](', forbid: 'Release notes' }
          - { name: test-post-failed,         event: post-deployment, alert: error,   env: test,  prev: single,  expect: '[Compare changes](', forbid: 'Monitor' }
          - { name: int-same-commit-redeploy, event: pre-deployment,  alert: info,    env: int,   prev: same,    expect: '@slack',             forbid: 'Compare' }
          - { name: int-first-deploy-no-prev, event: pre-deployment,  alert: info,    env: int,   prev: none,    expect: '@slack',             forbid: 'Links:' }
          - { name: int-bad-previous-json,    event: pre-deployment,  alert: info,    env: int,   prev: invalid, expect: '@slack',             forbid: 'Compare' }
          - { name: prod-post-success,        event: post-deployment, alert: success, env: prod,  prev: single,  expect: '[Monitor](',         forbid: 'Compare' }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 3

      - name: Build sample inputs from real POC commits
        id: prev
        env:
          KIND: ${{ matrix.prev }}
        run: |
          new="$(git rev-parse HEAD)"
          old="$(git rev-parse HEAD~1)"
          old2="$(git rev-parse HEAD~2)"
          case "$KIND" in
            single)  json="{\"us-east-1\":{\"sha\":\"$old\",\"version\":\"1.0.0\"}}" ;;
            multi)   json="{\"us-east-1\":{\"sha\":\"$old\",\"version\":\"1.0.0\"},\"eu-west-1\":{\"sha\":\"$old2\",\"version\":\"1.0.0\"}}" ;;
            same)    json="{\"us-east-1\":{\"sha\":\"$new\",\"version\":\"1.0.1\"}}" ;;
            none)    json="" ;;
            invalid) json="not-json" ;;
          esac
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Run merged v5 action code (send stubbed)
        uses: ./.github/actions/send-datadog-deployment-event-v5
        with:
          event-type: ${{ matrix.event }}
          alert-type: ${{ matrix.alert }}
          service: poc-service
          environment: ${{ matrix.env }}
          regions: '["us-east-1","eu-west-1"]'
          version: 1.0.1
          tag-prefix: v
          commit-sha: ${{ steps.prev.outputs.new }}
          previous-region-info: ${{ steps.prev.outputs.json }}
          deployer: ${{ github.actor }}
          datadog-api-key: dummy-not-a-real-key
          continue-on-error: "true"

      - name: Show the message that WOULD have been sent
        run: |
          echo "---------- ${{ matrix.name }} ----------"
          cat "$RUNNER_TEMP/event.txt"

      - name: Assert text
        env:
          EXPECT: ${{ matrix.expect }}
          FORBID: ${{ matrix.forbid }}
        run: |
          t="$(cat "$RUNNER_TEMP/event.txt")"
          if [[ -n "$EXPECT" && "$t" != *"$EXPECT"* ]]; then echo "::error::missing expected: $EXPECT"; exit 1; fi
          if [[ -n "$FORBID" && "$t" == *"$FORBID"* ]]; then echo "::error::found forbidden: $FORBID"; exit 1; fi
          echo "OK"

      - name: Verify every Compare link opens (real GitHub request)
        run: |
          { grep -o 'https://github.com/[^)]*/compare/[^)]*' "$RUNNER_TEMP/event.txt" || true; } | sort -u | while read -r url; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$code $url"
            [[ "$code" == 200 ]] || { echo "::error::compare link returned $code"; exit 1; }
          done
          echo "compare links checked"
