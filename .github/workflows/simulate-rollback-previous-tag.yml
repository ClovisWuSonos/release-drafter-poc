name: Simulate Rollback — previous-tag verification

# Simulates a 3-release rollback scenario end-to-end to verify that `previous-tag`
# correctly anchors the post-rollback changelog.
#
# Release timeline:
#   sim-1.0.0  — good baseline, tagged at 1fcac85 (after PR #15)
#   sim-1.0.1  — bad release,   tagged at f3cd383 (after PR #17), gets rolled back
#   sim-1.0.2  — post-rollback, tagged at HEAD
#
# PR distribution:
#   sim-1.0.0 → sim-1.0.1 : PRs #16, #17
#   sim-1.0.1 → HEAD      : PRs #18, #19, #20+
#   sim-1.0.0 → HEAD      : PRs #16, #17, #18, #19, #20+  ← correct range after rollback
#
# Each release:
#   - Changelog generated by release-drafter with previous-tag (no manual edits)
#   - Rollout status injected via the same logic as action-update-region-rollout-status
#
# Key assertion:
#   sim-1.0.2 must include PRs #16 and #17 (anchored at sim-1.0.0, not sim-1.0.1).
#   If only #18+ appear, previous-tag failed to override the highest-semver default.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

env:
  TAG_100: sim-1.0.0
  TAG_101: sim-1.0.1
  TAG_102: sim-1.0.2
  COMMIT_100: 1fcac8571106b81b596912759203cf4f4ee3d392
  COMMIT_101: f3cd383ab46b5b69c14020974421f394b1560a01
  RD_SHA: f259c0ada5376557cd49e74487398301fab5287a

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:

      # ── Cleanup leftovers from prior runs ────────────────────────────────────
      - name: Cleanup prior sim releases and tags
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tags = [process.env.TAG_100, process.env.TAG_101, process.env.TAG_102];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const tag of tags) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted release ${tag}`);
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Deleted tag ${tag}`);
              } catch { core.info(`Tag ${tag} did not exist`); }
            }

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 1 — sim-1.0.0 (good baseline)
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 1 — create tag sim-1.0.0"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_100}`,
              sha: process.env.COMMIT_100,
            });
            core.info(`Tagged ${process.env.TAG_100} at ${process.env.COMMIT_100}`);

      - name: "Rel 1 — draft changelog (no anchor — first release)"
        id: draft-100
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ env.COMMIT_100 }}
          tag: ${{ env.TAG_100 }}
          version: "1.0.0"
          name: "Sim 1.0.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 1 — inject rollout status (complete)"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-100.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            const START = '<!-- rollout-status:start -->';
            const END   = '<!-- rollout-status:end -->';
            const block = `${START}\n## Rollout Status\n\nus-east-1: ✅ complete\neu-west-1: ✅ complete\n${END}`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id,
              body: `${rel.body ?? ''}\n\n${block}`,
            });
            core.info(`Injected rollout status into ${rel.tag_name}`);

      - name: "Rel 1 — publish and mark --latest"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-100.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false, make_latest: 'true',
            });
            core.info(`Published sim-1.0.0 and marked --latest`);

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 2 — sim-1.0.1 (bad release — will be rolled back)
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 2 — create tag sim-1.0.1"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_101}`,
              sha: process.env.COMMIT_101,
            });
            core.info(`Tagged ${process.env.TAG_101} at ${process.env.COMMIT_101}`);

      - name: "Rel 2 — draft changelog (from: sim-1.0.0 → expects PRs #16 #17)"
        id: draft-101
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ env.COMMIT_101 }}
          tag: ${{ env.TAG_101 }}
          version: "1.0.1"
          name: "Sim 1.0.1"
          from: ${{ env.TAG_100 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 2 — inject rollout status (complete)"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-101.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            const START = '<!-- rollout-status:start -->';
            const END   = '<!-- rollout-status:end -->';
            const block = `${START}\n## Rollout Status\n\nus-east-1: ✅ complete\neu-west-1: ✅ complete\n${END}`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id,
              body: `${rel.body ?? ''}\n\n${block}`,
            });
            core.info(`Injected rollout status into ${rel.tag_name}`);

      - name: "Rel 2 — publish and mark --latest"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-101.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false, make_latest: 'true',
            });
            core.info(`Published sim-1.0.1 and marked --latest`);

      # ════════════════════════════════════════════════════════════════════════
      # ROLLBACK — sim-1.0.1 → sim-1.0.0
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rollback — update sim-1.0.1 rollout status to rolled-back"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-101.outputs.id }}
          ROLLBACK_TO: ${{ env.TAG_100 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rollbackTo = process.env.ROLLBACK_TO;
            const { data: rel } = await github.rest.repos.getRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            const body = (rel.body ?? '')
              .replace('us-east-1: ✅ complete', `us-east-1: ⏪ rolled-back → ${rollbackTo}`)
              .replace('eu-west-1: ✅ complete', `eu-west-1: ⏪ rolled-back → ${rollbackTo}`);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, body,
            });
            core.info(`Marked sim-1.0.1 as rolled-back → ${rollbackTo}`);

      - name: "Rollback — re-point --latest to sim-1.0.0"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-100.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID), make_latest: 'true',
            });
            // Allow up to 15s for propagation (GitHub API can be slow for --latest updates)
            for (let i = 0; i < 15; i++) {
              await new Promise(r => setTimeout(r, 1000));
              const { data: latest } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner, repo: context.repo.repo,
              });
              if (latest.tag_name === process.env.TAG_100) {
                core.info(`--latest confirmed: ${latest.tag_name} (attempt ${i+1})`);
                return;
              }
              core.info(`--latest is ${latest.tag_name}, waiting... (attempt ${i+1})`);
            }
            core.setFailed(`--latest did not update to ${process.env.TAG_100} after 15 attempts`);

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 3 — sim-1.0.2 (post-rollback fix)
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 3 — create tag sim-1.0.2 at HEAD"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_102}`,
              sha: context.sha,
            });
            core.info(`Tagged ${process.env.TAG_102} at ${context.sha}`);

      # Key test: from anchors at sim-1.0.0 (the rollback target), not sim-1.0.1
      # (the higher-semver bad release). Correct changelog = PRs #16, #17, #18, #19, #20+.
      - name: "Rel 3 — draft changelog (from: sim-1.0.0 — rollback anchor)"
        id: draft-102
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ github.sha }}
          tag: ${{ env.TAG_102 }}
          version: "1.0.2"
          name: "Sim 1.0.2"
          from: ${{ env.TAG_100 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 3 — inject rollout status (complete)"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-102.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            const START = '<!-- rollout-status:start -->';
            const END   = '<!-- rollout-status:end -->';
            const block = `${START}\n## Rollout Status\n\nus-east-1: ✅ complete\neu-west-1: ✅ complete\n${END}`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id,
              body: `${rel.body ?? ''}\n\n${block}`,
            });
            core.info(`Injected rollout status into ${rel.tag_name}`);

      - name: "Rel 3 — publish and mark --latest"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-102.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false, make_latest: 'true',
            });
            core.info(`Published sim-1.0.2 and marked --latest`);

      # ════════════════════════════════════════════════════════════════════════
      # ASSERT + SUMMARY
      # ════════════════════════════════════════════════════════════════════════

      - name: Assert changelogs and write summary
        uses: actions/github-script@v7
        env:
          ID_100: ${{ steps.draft-100.outputs.id }}
          ID_101: ${{ steps.draft-101.outputs.id }}
          ID_102: ${{ steps.draft-102.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const get = async (id) => {
              const { data: rel } = await github.rest.repos.getRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: Number(id),
              });
              const body = rel.body || '';
              return { url: rel.html_url, tag: rel.tag_name, body, has: (n) => body.includes(`#${n}`) };
            };

            const r100 = await get(process.env.ID_100);
            const r101 = await get(process.env.ID_101);
            const r102 = await get(process.env.ID_102);

            core.info(`sim-1.0.1 body:\n${r101.body}`);
            core.info(`sim-1.0.2 body:\n${r102.body}`);

            // sim-1.0.1: previous-tag=sim-1.0.0 → should include #16, #17 but NOT #18
            const r101_correct = r101.has(16) && r101.has(17) && !r101.has(18);
            // sim-1.0.2: previous-tag=sim-1.0.0 (rollback target) → must include #16, #17, #18
            const r102_correct = r102.has(16) && r102.has(17) && r102.has(18);
            const rolledBack = r101.body.includes('rolled-back');

            const fmt = (b) => b ? '✅' : '❌';

            await core.summary
              .addHeading('Rollback Simulation — previous-tag verification')
              .addTable([
                [{data:'Release',header:true},{data:'Anchor',header:true},{data:'PR #16',header:true},{data:'PR #17',header:true},{data:'PR #18',header:true},{data:'Rollout Status',header:true}],
                ['sim-1.0.0','(first release)','—','—','—','✅ complete'],
                ['sim-1.0.1','from: sim-1.0.0',fmt(r101.has(16)),fmt(r101.has(17)),`${fmt(!r101.has(18))} (not expected)`,rolledBack ? '⏪ rolled-back' : '❓'],
                ['sim-1.0.2','from: sim-1.0.0 (rollback anchor)',fmt(r102.has(16)),fmt(r102.has(17)),fmt(r102.has(18)),'✅ complete'],
              ])
              .addHeading('Verdict', 3)
              .addRaw(r102_correct
                ? '✅ sim-1.0.2 includes PRs #16 and #17 — from: correctly anchored at sim-1.0.0 (rolled-back-to), not sim-1.0.1 (higher-semver bad release).'
                : '❌ sim-1.0.2 is missing PRs #16 or #17 — from: did NOT anchor at the rollback target.')
              .addEOL()
              .addLink('sim-1.0.0', r100.url)
              .addRaw(' · ')
              .addLink('sim-1.0.1 (rolled back)', r101.url)
              .addRaw(' · ')
              .addLink('sim-1.0.2', r102.url)
              .write();

            if (!r101_correct) core.setFailed(`sim-1.0.1 changelog wrong: #16=${r101.has(16)} #17=${r101.has(17)}`);
            if (!r102_correct) core.setFailed(`sim-1.0.2 missing PRs #16/#17 — previous-tag not anchoring at rollback target`);
            if (!rolledBack)   core.setFailed(`sim-1.0.1 rollout status does not show rolled-back`);

      # ── Cleanup ───────────────────────────────────────────────────────────────
      - name: Cleanup sim releases and tags
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tags = [process.env.TAG_100, process.env.TAG_101, process.env.TAG_102];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const tag of tags) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Cleaned ${tag}`);
              } catch { core.info(`${tag} already gone`); }
            }
