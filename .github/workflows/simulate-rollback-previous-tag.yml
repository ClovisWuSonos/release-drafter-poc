name: Simulate Rollback — previous-tag verification

# Simulates a 3-release rollback scenario end-to-end to verify that `previous-tag`
# correctly anchors the post-rollback changelog.
#
# Release timeline:
#   sim-1.0.0  — good baseline, tagged at 1fcac85 (after PR #15)
#   sim-1.0.1  — bad release,   tagged at f3cd383 (after PR #17), gets rolled back
#   sim-1.0.2  — post-rollback, tagged at HEAD
#
# PR distribution:
#   sim-1.0.0 → sim-1.0.1 : PRs #16, #17
#   sim-1.0.1 → HEAD      : PRs #18, #19, #20+
#   sim-1.0.0 → HEAD      : PRs #16, #17, #18, #19, #20+  ← correct range after rollback
#
# Each release:
#   - Changelog generated by release-drafter with previous-tag (no manual edits)
#   - Rollout status injected via the same logic as action-update-region-rollout-status
#
# Key assertion:
#   sim-1.0.2 must include PRs #16 and #17 (i.e. anchored at sim-1.0.0, not sim-1.0.1).
#   If only #18+ appear, previous-tag failed to override the highest-semver default.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

env:
  TAG_100: sim-1.0.0
  TAG_101: sim-1.0.1
  TAG_102: sim-1.0.2
  COMMIT_100: 1fcac85
  COMMIT_101: f3cd383
  RD_SHA: f259c0ada5376557cd49e74487398301fab5287a

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:

      # ── Cleanup leftovers from prior runs ────────────────────────────────────
      - name: Cleanup prior sim releases and tags
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tags = [process.env.TAG_100, process.env.TAG_101, process.env.TAG_102];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const tag of tags) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted release ${tag}`);
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Deleted tag ${tag}`);
              } catch { core.info(`Tag ${tag} did not exist`); }
            }

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 1 — sim-1.0.0 (good baseline)
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 1 — create tag sim-1.0.0 at 1fcac85"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_100}`,
              sha: process.env.COMMIT_100,
            });
            core.info(`Tagged ${process.env.TAG_100} at ${process.env.COMMIT_100}`);

      - name: "Rel 1 — draft changelog (no anchor — first release)"
        id: draft-100
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ env.COMMIT_100 }}
          tag: ${{ env.TAG_100 }}
          version: "1.0.0"
          name: "Sim 1.0.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 1 — inject rollout status (us-east-1 + eu-west-1 complete)"
        uses: actions/github-script@v7
        env:
          REL_TAG: ${{ env.TAG_100 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.REL_TAG;
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag,
            });
            const START = '<!-- rollout-status:start -->';
            const END   = '<!-- rollout-status:end -->';
            const block = [
              START,
              '## Rollout Status',
              '',
              'us-east-1: ✅ complete',
              'eu-west-1: ✅ complete',
              END,
            ].join('\n');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id,
              body: `${rel.body ?? ''}\n\n${block}`,
            });
            core.info(`Injected rollout status into ${tag}`);

      - name: "Rel 1 — publish and mark --latest"
        uses: actions/github-script@v7
        env:
          REL_TAG: ${{ env.TAG_100 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.REL_TAG;
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, draft: false, make_latest: 'true',
            });
            core.info(`Published ${tag} and marked --latest`);

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 2 — sim-1.0.1 (bad release — will be rolled back)
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 2 — create tag sim-1.0.1 at f3cd383"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_101}`,
              sha: process.env.COMMIT_101,
            });
            core.info(`Tagged ${process.env.TAG_101} at ${process.env.COMMIT_101}`);

      - name: "Rel 2 — draft changelog (previous-tag: sim-1.0.0 → expects PRs #16 #17)"
        id: draft-101
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ env.COMMIT_101 }}
          tag: ${{ env.TAG_101 }}
          version: "1.0.1"
          name: "Sim 1.0.1"
          previous-tag: ${{ env.TAG_100 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 2 — inject rollout status (us-east-1 + eu-west-1 complete)"
        uses: actions/github-script@v7
        env:
          REL_TAG: ${{ env.TAG_101 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.REL_TAG;
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag,
            });
            const START = '<!-- rollout-status:start -->';
            const END   = '<!-- rollout-status:end -->';
            const block = [
              START,
              '## Rollout Status',
              '',
              'us-east-1: ✅ complete',
              'eu-west-1: ✅ complete',
              END,
            ].join('\n');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id,
              body: `${rel.body ?? ''}\n\n${block}`,
            });
            core.info(`Injected rollout status into ${tag}`);

      - name: "Rel 2 — publish and mark --latest"
        uses: actions/github-script@v7
        env:
          REL_TAG: ${{ env.TAG_101 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.REL_TAG;
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, draft: false, make_latest: 'true',
            });
            core.info(`Published ${tag} and marked --latest`);

      # ════════════════════════════════════════════════════════════════════════
      # ROLLBACK — sim-1.0.1 → sim-1.0.0
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rollback — update sim-1.0.1 rollout status to rolled-back"
        uses: actions/github-script@v7
        env:
          REL_TAG: ${{ env.TAG_101 }}
          ROLLBACK_TO: ${{ env.TAG_100 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.REL_TAG;
            const rollbackTo = process.env.ROLLBACK_TO;
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag,
            });
            const START = '<!-- rollout-status:start -->';
            const END   = '<!-- rollout-status:end -->';
            let body = rel.body ?? '';
            if (body.includes(START)) {
              body = body
                .replace('us-east-1: ✅ complete', `us-east-1: ⏪ rolled-back → ${rollbackTo}`)
                .replace('eu-west-1: ✅ complete', `eu-west-1: ⏪ rolled-back → ${rollbackTo}`);
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, body,
            });
            core.info(`Marked ${tag} as rolled-back → ${rollbackTo}`);

      - name: "Rollback — re-point --latest to sim-1.0.0"
        uses: actions/github-script@v7
        env:
          REL_TAG: ${{ env.TAG_100 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.REL_TAG;
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, make_latest: 'true',
            });
            // Verify
            for (let i = 0; i < 5; i++) {
              const { data: latest } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner, repo: context.repo.repo,
              });
              if (latest.tag_name === tag) {
                core.info(`--latest confirmed: ${tag}`);
                return;
              }
              await new Promise(r => setTimeout(r, 1000));
            }
            core.setFailed(`--latest did not update to ${tag}`);

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 3 — sim-1.0.2 (post-rollback fix)
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 3 — create tag sim-1.0.2 at HEAD"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_102}`,
              sha: context.sha,
            });
            core.info(`Tagged ${process.env.TAG_102} at ${context.sha}`);

      # Key test: previous-tag anchors at sim-1.0.0 (the rollback target), not sim-1.0.1
      # (the higher-semver bad release). Correct changelog = PRs #16, #17, #18, #19, #20+.
      - name: "Rel 3 — draft changelog (previous-tag: sim-1.0.0 — rollback anchor)"
        id: draft-102
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ github.sha }}
          tag: ${{ env.TAG_102 }}
          version: "1.0.2"
          name: "Sim 1.0.2"
          previous-tag: ${{ env.TAG_100 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 3 — inject rollout status (us-east-1 + eu-west-1 complete)"
        uses: actions/github-script@v7
        env:
          REL_TAG: ${{ env.TAG_102 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.REL_TAG;
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag,
            });
            const START = '<!-- rollout-status:start -->';
            const END   = '<!-- rollout-status:end -->';
            const block = [
              START,
              '## Rollout Status',
              '',
              'us-east-1: ✅ complete',
              'eu-west-1: ✅ complete',
              END,
            ].join('\n');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id,
              body: `${rel.body ?? ''}\n\n${block}`,
            });
            core.info(`Injected rollout status into ${tag}`);

      - name: "Rel 3 — publish and mark --latest"
        uses: actions/github-script@v7
        env:
          REL_TAG: ${{ env.TAG_102 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.REL_TAG;
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, draft: false, make_latest: 'true',
            });
            core.info(`Published ${tag} and marked --latest`);

      # ════════════════════════════════════════════════════════════════════════
      # ASSERT + SUMMARY
      # ════════════════════════════════════════════════════════════════════════

      - name: Assert changelogs and write summary
        uses: actions/github-script@v7
        env:
          TAG_100: ${{ env.TAG_100 }}
          TAG_101: ${{ env.TAG_101 }}
          TAG_102: ${{ env.TAG_102 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const getTags = async (tag) => {
              const { data: rel } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag,
              });
              const body = rel.body || '';
              return { url: rel.html_url, body, has: (n) => body.includes(`#${n}`) };
            };

            const r100 = await getTags(process.env.TAG_100);
            const r101 = await getTags(process.env.TAG_101);
            const r102 = await getTags(process.env.TAG_102);

            core.info(`sim-1.0.1 body:\n${r101.body}`);
            core.info(`sim-1.0.2 body:\n${r102.body}`);

            // sim-1.0.1: anchored at 1.0.0 → should have #16, #17
            const r101_correct = r101.has(16) && r101.has(17) && !r101.has(18);
            // sim-1.0.2: anchored at 1.0.0 (rollback target) → should have #16, #17, #18
            const r102_correct = r102.has(16) && r102.has(17) && r102.has(18);

            const rolledBack = r101.body.includes('rolled-back');

            const fmt = (b) => b ? '✅' : '❌';

            await core.summary
              .addHeading('Rollback Simulation — previous-tag verification')
              .addTable([
                [{data:'Release',header:true},{data:'Anchor',header:true},{data:'#16',header:true},{data:'#17',header:true},{data:'#18',header:true},{data:'Rollout Status',header:true},{data:'',header:true}],
                ['sim-1.0.0','(first release)','—','—','—','✅ complete',''],
                ['sim-1.0.1',`previous-tag: sim-1.0.0`,fmt(r101.has(16)),fmt(r101.has(17)),`${fmt(!r101.has(18))} not expected`,rolledBack ? '⏪ rolled-back' : '❓',''],
                ['sim-1.0.2',`previous-tag: sim-1.0.0 (rollback anchor)`,fmt(r102.has(16)),fmt(r102.has(17)),fmt(r102.has(18)),'✅ complete',''],
              ])
              .addHeading('Key assertion', 3)
              .addRaw(r102_correct
                ? '✅ sim-1.0.2 includes PRs #16 and #17 — previous-tag correctly anchored at sim-1.0.0 (rolled-back-to), not sim-1.0.1 (higher semver bad release).'
                : '❌ sim-1.0.2 is missing PRs #16 or #17 — previous-tag did NOT override the highest-semver anchor.')
              .addEOL()
              .addLink('sim-1.0.0', r100.url)
              .addRaw(' | ')
              .addLink('sim-1.0.1 (rolled back)', r101.url)
              .addRaw(' | ')
              .addLink('sim-1.0.2', r102.url)
              .write();

            if (!r101_correct) core.setFailed(`sim-1.0.1 changelog wrong: #16=${r101.has(16)} #17=${r101.has(17)}`);
            if (!r102_correct) core.setFailed(`sim-1.0.2 does not include PRs since rollback target — previous-tag not working`);
            if (!rolledBack)   core.setFailed(`sim-1.0.1 rollout status not showing rolled-back`);

      # ── Cleanup ───────────────────────────────────────────────────────────────
      - name: Cleanup sim releases and tags
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tags = [process.env.TAG_100, process.env.TAG_101, process.env.TAG_102];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const tag of tags) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Cleaned ${tag}`);
              } catch { core.info(`${tag} already gone`); }
            }
