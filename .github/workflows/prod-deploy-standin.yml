name: prod-deploy-standin
on:
  workflow_call:
    inputs:
      service: { type: string, required: true }
concurrency:
  group: ${{ inputs.environment == 'prod' && format('argo-prod-deploy-{0}-{1}', github.repository, inputs.service) || format('argo-rollback-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo STANDIN START $(date -u +%T); sleep 40; echo STANDIN END $(date -u +%T)'
