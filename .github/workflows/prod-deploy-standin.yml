name: prod-deploy-standin
on:
  workflow_call:
    inputs:
      service: { type: string, required: true }
concurrency:
  group: argo-prod-deploy-${{ github.repository }}-${{ inputs.service }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo STANDIN START $(date -u +%T); sleep 40; echo STANDIN END $(date -u +%T)'
