name: Manual Deploy (POC)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version being deployed (e.g. 1.1.3) — must match an existing cloud-settings-* tag'
        required: true
        type: string
      simulate_failure:
        description: 'Simulate a failed region partway through the deploy'
        required: false
        type: boolean
        default: false
      fail_at_region:
        description: 'Which region fails, if simulate_failure is true'
        required: false
        type: choice
        default: us-west-2
        options:
          - us-east-1
          - us-west-2
          - eu-west-1

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history for Step E's tag comparison

      # Step A-guard: refuse to run against a version that's already
      # published. Confirmed by testing: re-running this workflow for an
      # already-published tag doesn't safely no-op — release-drafter
      # resolves "last release" to that same tag, computes the changelog for
      # commits *since* it (wrong range), then 422s trying to retag the
      # current draft to a tag_name that's already taken. That error does
      # NOT fail the step - it's swallowed, so the run reports success
      # having silently done nothing. Fail fast here instead, with a clear
      # reason, before any of that can happen.
      - name: "Step A-guard - Refuse to redeploy an already-published version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ALREADY_PUBLISHED=$(gh api "repos/${{ github.repository }}/releases/tags/cloud-settings-${{ inputs.version }}" \
            --jq '.draft == false' 2>/dev/null || echo "false")

          if [ "$ALREADY_PUBLISHED" == "true" ]; then
            echo "::error::cloud-settings-${{ inputs.version }} is already published. Re-running this workflow for it won't republish it correctly - release-drafter would compute the wrong commit range and fail to retag (see README). Deploy the current unreleased version instead."
            exit 1
          fi

      # Step A: verify a draft release exists for this version.
      - name: "Step A - Locate active draft release"
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRAFT_JSON=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[] | select(.draft == true)][0]')

          if [ -z "$DRAFT_JSON" ] || [ "$DRAFT_JSON" == "null" ]; then
            echo "::error::No open draft release found. Has release-drafter run yet on main?"
            exit 1
          fi

          DRAFT_TAG=$(echo "$DRAFT_JSON" | jq -r '.tag_name')
          echo "Found draft for tag=$DRAFT_TAG"
          echo "draft_tag=$DRAFT_TAG" >> "$GITHUB_OUTPUT"

      # Step B: simulate a region-by-region deploy. Collects each region's
      # outcome into a JSON array for the action in the next step.
      # Stops early on failure — later regions are never attempted.
      - name: "Step B - Simulate per-region deploy, collect outcomes"
        id: rollout
        run: |
          REGIONS=(us-east-1 us-west-2 eu-west-1)
          REGIONS_JSON='[]'
          DEPLOY_FAILED=false

          for REGION in "${REGIONS[@]}"; do
            sleep 3 # simulate per-region deploy time

            if [ "${{ inputs.simulate_failure }}" == "true" ] && [ "$REGION" == "${{ inputs.fail_at_region }}" ]; then
              STATUS="failed"
              DEPLOY_FAILED=true
            else
              STATUS="success"
            fi

            REGIONS_JSON=$(echo "$REGIONS_JSON" | jq \
              --arg r "$REGION" --arg s "$STATUS" \
              '. + [{"region": $r, "status": $s}]')

            echo "Region $REGION: $STATUS"

            if [ "$DEPLOY_FAILED" == "true" ]; then
              echo "Stopping rollout — $REGION failed."
              break
            fi
          done

          echo "regions_json=$REGIONS_JSON" >> "$GITHUB_OUTPUT"
          echo "deploy_failed=$DEPLOY_FAILED" >> "$GITHUB_OUTPUT"

      # Step B-action: write the per-region outcomes to the draft release body
      # so the status is visible before publish. On the failure path this is the
      # final write — Step B-fail exits the job immediately after.
      - name: "Step B-action - Write rollout status to draft"
        uses: ./.github/actions/update-region-rollout-status
        with:
          tag: ${{ steps.draft.outputs.draft_tag }}
          regions: ${{ steps.rollout.outputs.regions_json }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Step B-fail: fail the job cleanly. The draft body (updated above)
      # already shows which region failed. The draft itself is untouched and
      # keeps accumulating commits — the next push to main regenerates it.
      - name: "Step B-fail - Fail the job after a failed region"
        if: steps.rollout.outputs.deploy_failed == 'true'
        run: |
          echo "::error::Deploy of ${{ inputs.version }} failed at ${{ inputs.fail_at_region }}. Release NOT published; 'latest' unchanged."
          exit 1

      # Step C: sleep, giving you a window to merge a competing PR to main
      # (simulating the 1.1.4 race) while this deploy is still "in flight".
      # Skipped entirely on the failure path above (job already exited).
      - name: "Step C - Sleep to allow race-condition simulation"
        run: |
          echo "Sleeping 15s. Merge a competing PR to main NOW to simulate the race condition..."
          sleep 15

      # Step D-pin: resolve the exact commit SHA that
      # cloud-settings-${{ inputs.version }} points to. This is NOT
      # optional - confirmed by testing (see README): `tag`/`version` on the
      # release-drafter action only control naming. The changelog's commit
      # RANGE comes from a separate `commitish` input, which defaults to
      # `main` - a moving ref - if left unset. During a real race, `main` has
      # already advanced past the target tag by the time this step runs, so
      # without pinning `commitish` explicitly, the published changelog
      # picks up commits that landed after the tag, even though the tag
      # itself is correctly pinned. The tag being immutable was never
      # sufficient on its own.
      - name: "Step D-pin - Resolve the commit this version's tag points to"
        id: pin
        run: |
          SHA=$(git rev-parse "cloud-settings-${{ inputs.version }}")
          echo "cloud-settings-${{ inputs.version }} -> ${SHA}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Step D-anchor: get the rollback-aware changelog anchor.
      # repos.getLatestRelease() returns the --latest release, which
      # promote-release-to-latest manages correctly: after a rollback it points
      # to the rolled-back-to version, not the superseded one still published
      # at a higher semver.
      - name: "Step D-anchor - Get rollback-aware changelog anchor"
        id: anchor
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.info(`Latest release: ${data.tag_name}`);
              core.setOutput('tag', data.tag_name);
            } catch (e) {
              core.info('No releases yet — publishing without from anchor');
              core.setOutput('tag', '');
            }

      # Step D: publish the release for the tag we were actually deploying,
      # not whatever main/the draft looks like right now. `commitish` pins the
      # changelog to the exact deployed SHA. `from` anchors the changelog to
      # --latest, ensuring that after a rollback all re-shipped changes are
      # included — not just the fix.
      #
      # Note: release-drafter regenerates the full body on publish, so the
      # rollout status added in Step B-action is cleared. Step D-action
      # re-adds it to the now-published release.
      #
      # Two conditional steps because passing from: "" would cause release-drafter
      # to use an empty string as a git ref. On first release (no --latest yet),
      # from must be omitted entirely.
      - name: "Step D - Publish the release for this version"
        if: steps.anchor.outputs.tag != ''
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: true
          version: ${{ inputs.version }}
          tag: cloud-settings-${{ inputs.version }}
          commitish: ${{ steps.pin.outputs.sha }}
          from: ${{ steps.anchor.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Step D - Publish the release (first release — no anchor)"
        if: steps.anchor.outputs.tag == ''
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: true
          version: ${{ inputs.version }}
          tag: cloud-settings-${{ inputs.version }}
          commitish: ${{ steps.pin.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step D-action: add rollout status to the published release.
      # release-drafter regenerated the body on publish, so we re-apply the
      # status block here using the same regions_json from Step B.
      - name: "Step D-action - Add rollout status to published release"
        uses: ./.github/actions/update-region-rollout-status
        with:
          tag: cloud-settings-${{ inputs.version }}
          regions: ${{ steps.rollout.outputs.regions_json }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Step D2: mark this release as "latest" — GitHub's native
      # make_latest flag (gh release edit --latest), not a moved git tag.
      # Only ever reached after a successful publish, since B-fail exits
      # the job before this point on failure.
      - name: "Step D2 - Mark this release as latest (now in production)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "cloud-settings-${{ inputs.version }}" --latest
          echo "cloud-settings-${{ inputs.version }} marked as the latest release."

      # Step E: check whether a newer tag already exists beyond the one we
      # just published (e.g. cloud-settings-1.1.4, created by auto-tag during
      # the Step C race window). If so, immediately draft it — with an
      # explicit version/tag, same reasoning as Step D: never let
      # release-drafter guess its own version, always hand it the exact
      # tag it should match, so title and tag can't drift apart.
      - name: "Step E - Check for a newer tag beyond what was just published"
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force
          LATEST=$(git tag --list 'cloud-settings-*' \
            | sed 's/cloud-settings-//' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n1)

          if [ "$LATEST" == "${{ inputs.version }}" ]; then
            echo "No newer tag yet (latest is still ${LATEST}) — nothing to draft."
            echo "has_newer=false" >> "$GITHUB_OUTPUT"
          else
            echo "Newer tag found: cloud-settings-${LATEST}"
            echo "has_newer=true" >> "$GITHUB_OUTPUT"
            echo "next_version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: "Step E - Recreate the next draft immediately"
        if: steps.next.outputs.has_newer == 'true'
        uses: release-drafter/release-drafter@v6
        with:
          publish: false
          version: ${{ steps.next.outputs.next_version }}
          tag: cloud-settings-${{ steps.next.outputs.next_version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
