name: Test Footer Input

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Get --latest release tag
        id: last-release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.info(`Latest release: ${data.tag_name}`);
              core.setOutput('tag', data.tag_name);
            } catch (e) {
              core.info('No releases yet');
              core.setOutput('tag', '');
            }

      - name: Finalize and publish
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: ${{ steps.last-release.outputs.tag }}
          version: "0.0.3-combined-test"
          tag: "footer-test-0.0.3"
          name: "Footer Test Release 3"
          footer: |
            ## 🚀 Rollout Status
            All regions deployed successfully.
            | Region | Status |
            |---|---|
            | us-east-1 | ✅ Success |
            | eu-west-1 | ✅ Success |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
