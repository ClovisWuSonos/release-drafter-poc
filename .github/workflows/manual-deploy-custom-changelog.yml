name: Manual Deploy (Custom Changelog)

# Alternative to the release-drafter `from` approach.
# Builds the changelog manually by querying the GitHub API for commits
# between --latest and the deployed SHA, resolving associated merged PRs,
# and formatting the result as a release body.
# Tradeoff: more maintenance surface, more complex, less clean than the
# built-in `from` input — but does not depend on any unreleased feature.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 1.0.13) — must match an existing cloud-settings-* tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag SHA
        id: pin
        run: |
          git fetch --tags --force
          SHA=$(git rev-parse "cloud-settings-${{ inputs.version }}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build rollback-aware changelog
        id: changelog
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ steps.pin.outputs.sha }}
        with:
          script: |
            const deployedSha = process.env.DEPLOY_SHA;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            // Get --latest tag as rollback-aware anchor
            let anchorTag = '';
            try {
              const { data } = await github.rest.repos.getLatestRelease(repo);
              anchorTag = data.tag_name;
            } catch {}
            core.info(`Anchor: ${anchorTag || 'none (first release)'}`);

            // Get commits between anchor and deployed SHA (paginated)
            const commits = [];
            if (anchorTag) {
              for (let page = 1; ; page++) {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  ...repo, basehead: `${anchorTag}...${deployedSha}`, per_page: 100, page,
                });
                commits.push(...data.commits);
                if (data.commits.length < 100) break;
              }
            }

            // Resolve merged PRs per commit, deduplicate
            const seen = new Set();
            const prs = [];
            for (const { sha } of commits) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...repo, commit_sha: sha,
              });
              for (const pr of data) {
                if (pr.merged_at && !seen.has(pr.number)) { seen.add(pr.number); prs.push(pr); }
              }
            }
            core.info(`Found ${prs.length} unique merged PRs`);

            // Categorize by label
            const groups = { features: [], fixes: [], others: [] };
            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name);
              if (labels.includes('skip-changelog')) continue;
              if (labels.some(l => ['feature', 'enhancement'].includes(l))) groups.features.push(pr);
              else if (labels.some(l => ['fix', 'bug', 'bugfix'].includes(l))) groups.fixes.push(pr);
              else groups.others.push(pr);
            }

            // Format changelog
            const fmt = pr => `- ${pr.title} (#${pr.number}, @${pr.user.login})`;
            const sections = [
              groups.features.length && `## 🚀 Features\n\n${groups.features.map(fmt).join('\n')}`,
              groups.fixes.length    && `## 🐛 Bug Fixes\n\n${groups.fixes.map(fmt).join('\n')}`,
              groups.others.length   && `## 🧰 Changes\n\n${groups.others.map(fmt).join('\n')}`,
            ].filter(Boolean);

            const body = sections.length
              ? `## Changes\n\n${sections.join('\n\n')}`
              : '## Changes\n\nNo changes.';

            core.setOutput('body', body);

      - name: Publish release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_SHA: ${{ steps.pin.outputs.sha }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = `cloud-settings-${process.env.VERSION}`;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const footer = `\n<!-- rollout-status-start -->\n## 🚀 Rollout Status\nus-east-1: ✅ Deployed\neu-west-1: ✅ Deployed\n<!-- rollout-status-end -->`;
            const release = {
              name: `Cloud Settings ${process.env.VERSION}`,
              body: process.env.CHANGELOG_BODY + footer,
              draft: false,
              prerelease: false,
            };

            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
              await github.rest.repos.updateRelease({ ...repo, release_id: data.id, ...release });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.repos.createRelease({ ...repo, tag_name: tag, target_commitish: process.env.DEPLOY_SHA, ...release });
            }

      - name: Mark as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "cloud-settings-${{ inputs.version }}" --latest
