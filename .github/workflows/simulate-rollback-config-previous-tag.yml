name: Simulate Rollback — config previous-tag

# Tests whether setting `previous-tag` in release-drafter.yml (config file)
# correctly anchors the post-rollback changelog.
#
# previous-tag as a config option is STATIC — it must be manually updated
# after each rollback. This simulation demonstrates that flow end-to-end.
#
# Timeline:
#   cprev-1.0.0       — good baseline, tagged at d275ebe (after PR #18)
#   cprev-1.0.1       — bad release,   tagged at 4676fbe (after PR #22), gets rolled back
#   cprev-1.0.2-wrong — from: cprev-1.0.1 (simulates wrong post-rollback anchor)
#   cprev-1.0.2-right — no from:, previous-tag: cprev-1.0.0 in config (the test)
#
# PR distribution:
#   cprev-1.0.0 → cprev-1.0.1 : PRs #19, #20, #21, #22  ← "lost" PRs after rollback
#   cprev-1.0.1 → HEAD         : PRs #23–#31
#   cprev-1.0.0 → HEAD         : PRs #19–#31             ← correct range
#
# Key question:
#   Does `previous-tag: cprev-1.0.0` in the config cause cprev-1.0.2-right to
#   include PRs #19-#22 (the rolled-back range)?

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

env:
  CONFIG_NAME: release-drafter-cprev-test.yml
  TAG_100: cprev-1.0.0
  TAG_101: cprev-1.0.1
  TAG_102_WRONG: cprev-1.0.2-wrong
  TAG_102_RIGHT: cprev-1.0.2-right
  COMMIT_100: d275ebe484a594977e744c4f34e5a076d3a6bef9
  COMMIT_101: 4676fbe6e14a43be32295279d5e3cb3b37bee5a7
  RD_SHA: f259c0ada5376557cd49e74487398301fab5287a

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:

      # ── Cleanup leftovers from prior runs ────────────────────────────────────
      - name: Cleanup prior sim releases and tags
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tags = [
              process.env.TAG_100, process.env.TAG_101,
              process.env.TAG_102_WRONG, process.env.TAG_102_RIGHT,
            ];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const tag of tags) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted release ${tag}`);
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Deleted tag ${tag}`);
              } catch { core.info(`Tag ${tag} did not exist`); }
            }

      # ── Disable push-triggered release-drafter workflows ─────────────────────
      # Both release-drafter.yml and release-drafter-simplified.yml run on every
      # push to main, creating floating drafts that interfere with anchor lookups.
      # Use the Trees API to remove both files in a SINGLE commit so that commit
      # itself does not trigger either workflow.
      - name: Disable push-triggered release-drafter workflows
        id: disable-rd
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // Read both files so we can restore them later
            const paths = [
              '.github/workflows/release-drafter.yml',
              '.github/workflows/release-drafter-simplified.yml',
            ];
            const saved = {};
            for (const path of paths) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path });
                saved[path] = Buffer.from(data.content, 'base64').toString();
              } catch {
                core.info(`${path} not found — skipping`);
              }
            }

            // Export saved contents so the cleanup step can restore them
            core.exportVariable('RD_SAVED_FILES', JSON.stringify(saved));

            // Get current HEAD commit to base the new tree on
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const headSha = ref.object.sha;
            const { data: headCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: headSha });

            // Create a tree that removes both workflow files (null sha = deletion)
            const treeEntries = paths
              .filter(p => saved[p])
              .map(path => ({ path, mode: '100644', type: 'blob', sha: null }));

            if (treeEntries.length === 0) {
              core.info('No rd workflows found to disable');
              return;
            }

            const { data: newTree } = await github.rest.git.createTree({
              owner, repo,
              base_tree: headCommit.tree.sha,
              tree: treeEntries,
            });

            const { data: newCommit } = await github.rest.git.createCommit({
              owner, repo,
              message: 'test: disable rd workflows for cprev simulation (restored in cleanup)',
              tree: newTree.sha,
              parents: [headSha],
            });

            await github.rest.git.updateRef({ owner, repo, ref: 'heads/main', sha: newCommit.sha });
            core.info(`Disabled ${treeEntries.length} rd workflows in commit ${newCommit.sha}`);

      # ── Create test config (no previous-tag) ─────────────────────────────────
      - name: Create test release-drafter config (no previous-tag)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = `.github/${process.env.CONFIG_NAME}`;
            const content = [
              `name-template: 'Config PrevTag $RESOLVED_VERSION'`,
              `tag-template: 'cprev-$RESOLVED_VERSION'`,
              `change-template: '- $TITLE (#$NUMBER, @$AUTHOR)'`,
              ``,
              `categories:`,
              `  - title: '🚀 Features'`,
              `    when:`,
              `      - labels: ['feature', 'enhancement']`,
              `  - title: '🐛 Bug Fixes'`,
              `    when:`,
              `      - labels: ['fix', 'bugfix', 'bug']`,
              `  - title: '🧰 Maintenance'`,
              `    when:`,
              `      - labels: ['chore', 'maintenance']`,
              ``,
              `template: |`,
              `  ## Changes`,
              ``,
              `  $CHANGES`,
            ].join('\n');

            let sha;
            try {
              const { data: existing } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path,
              });
              sha = existing.sha;
            } catch {}

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path, message: `test: create release-drafter config for cprev simulation`,
              content: Buffer.from(content).toString('base64'),
              ...(sha ? { sha } : {}),
            });
            core.info(`Config created at ${path}`);

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 1 — cprev-1.0.0 (good baseline)
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 1 — create tag cprev-1.0.0"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_100}`,
              sha: process.env.COMMIT_100,
            });

      - name: "Rel 1 — draft changelog (first release, no anchor)"
        id: draft-100
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ env.COMMIT_100 }}
          tag: ${{ env.TAG_100 }}
          version: "1.0.0"
          name: "Config PrevTag 1.0.0"
          config-name: ${{ env.CONFIG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 1 — inject rollout status (complete)"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-100.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            const block = `<!-- rollout-status:start -->\n## Rollout Status\n\nus-east-1: ✅ complete\neu-west-1: ✅ complete\n<!-- rollout-status:end -->`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, body: `${rel.body ?? ''}\n\n${block}`,
            });

      - name: "Rel 1 — publish and mark --latest"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-100.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false, make_latest: 'true',
            });

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 2 — cprev-1.0.1 (bad release — will be rolled back)
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 2 — create tag cprev-1.0.1"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_101}`,
              sha: process.env.COMMIT_101,
            });

      - name: "Rel 2 — draft changelog (from: cprev-1.0.0 → PRs #19 #20 #21 #22)"
        id: draft-101
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ env.COMMIT_101 }}
          tag: ${{ env.TAG_101 }}
          version: "1.0.1"
          name: "Config PrevTag 1.0.1"
          config-name: ${{ env.CONFIG_NAME }}
          from: ${{ env.TAG_100 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 2 — inject rollout status (complete)"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-101.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            const block = `<!-- rollout-status:start -->\n## Rollout Status\n\nus-east-1: ✅ complete\neu-west-1: ✅ complete\n<!-- rollout-status:end -->`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, body: `${rel.body ?? ''}\n\n${block}`,
            });

      - name: "Rel 2 — publish and mark --latest"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-101.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false, make_latest: 'true',
            });

      # ════════════════════════════════════════════════════════════════════════
      # ROLLBACK — cprev-1.0.1 → cprev-1.0.0
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rollback — update cprev-1.0.1 rollout status to rolled-back"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-101.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            const body = (rel.body ?? '')
              .replace('us-east-1: ✅ complete', `us-east-1: ⏪ rolled-back → ${process.env.TAG_100}`)
              .replace('eu-west-1: ✅ complete', `eu-west-1: ⏪ rolled-back → ${process.env.TAG_100}`);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, body,
            });

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 3 WRONG — explicit wrong anchor (cprev-1.0.1)
      # Simulates what happens after rollback with no config override.
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 3 WRONG — create tag cprev-1.0.2-wrong at HEAD"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_102_WRONG}`,
              sha: context.sha,
            });

      - name: "Rel 3 WRONG — draft (from: cprev-1.0.1 — wrong anchor)"
        id: draft-102-wrong
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ github.sha }}
          tag: ${{ env.TAG_102_WRONG }}
          version: "1.0.2"
          name: "Config PrevTag 1.0.2 — WRONG (anchored at bad release)"
          config-name: ${{ env.CONFIG_NAME }}
          from: ${{ env.TAG_101 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 3 WRONG — publish (keeps it out of draft anchor pool for right step)"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-102-wrong.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
            core.info(`Published ${process.env.TAG_102_WRONG}`);

      # ════════════════════════════════════════════════════════════════════════
      # MANUAL OPERATION — update config to add previous-tag: cprev-1.0.0
      # In real usage this is a manual PR/commit to release-drafter.yml.
      # Simulated via GitHub API (no push-triggered workflows active to interfere).
      # ════════════════════════════════════════════════════════════════════════

      - name: "Manual op — add previous-tag: cprev-1.0.0 to config"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = `.github/${process.env.CONFIG_NAME}`;
            const { data: existing } = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo, path,
            });
            const currentContent = Buffer.from(existing.content, 'base64').toString();
            const lines = currentContent.split('\n');
            lines.splice(1, 0, `previous-tag: '${process.env.TAG_100}'`);
            const newContent = lines.join('\n');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path, message: `manual: set previous-tag to ${process.env.TAG_100} after rollback`,
              content: Buffer.from(newContent).toString('base64'),
              sha: existing.sha,
            });
            core.info(`Updated config: added previous-tag: ${process.env.TAG_100}`);
            core.info(`New config:\n${newContent}`);

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 3 RIGHT — with previous-tag: cprev-1.0.0 in config
      # No from: input — relies solely on config to set the anchor.
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 3 RIGHT — create tag cprev-1.0.2-right at HEAD"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_102_RIGHT}`,
              sha: context.sha,
            });

      - name: "Rel 3 RIGHT — draft (previous-tag: cprev-1.0.0 in config, no from input)"
        id: draft-102-right
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ github.sha }}
          tag: ${{ env.TAG_102_RIGHT }}
          version: "1.0.2"
          name: "Config PrevTag 1.0.2 — RIGHT? (config previous-tag set)"
          config-name: ${{ env.CONFIG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 3 RIGHT — publish"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-102-right.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });

      # ════════════════════════════════════════════════════════════════════════
      # ASSERT + SUMMARY
      # ════════════════════════════════════════════════════════════════════════

      - name: Assert changelogs and write summary
        uses: actions/github-script@v7
        env:
          ID_100: ${{ steps.draft-100.outputs.id }}
          ID_101: ${{ steps.draft-101.outputs.id }}
          ID_102_WRONG: ${{ steps.draft-102-wrong.outputs.id }}
          ID_102_RIGHT: ${{ steps.draft-102-right.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const get = async (id) => {
              const { data: rel } = await github.rest.repos.getRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: Number(id),
              });
              const body = rel.body || '';
              return { url: rel.html_url, tag: rel.tag_name, body, has: (n) => body.includes(`#${n}`) };
            };

            const r101       = await get(process.env.ID_101);
            const r102_wrong = await get(process.env.ID_102_WRONG);
            const r102_right = await get(process.env.ID_102_RIGHT);

            core.info(`cprev-1.0.1 body:\n${r101.body}`);
            core.info(`cprev-1.0.2-wrong body:\n${r102_wrong.body}`);
            core.info(`cprev-1.0.2-right body:\n${r102_right.body}`);

            const r101_correct  = r101.has(19) && r101.has(22) && !r101.has(23);
            const rolledBack    = r101.body.includes('rolled-back');

            // wrong: anchored at cprev-1.0.1 → has #23+ but missing #19-#22
            const wrong_correct = r102_wrong.has(23) && !r102_wrong.has(19);

            // right: does config previous-tag override the anchor?
            // Expected if it works: has #19, #22, #23 (spans full range since cprev-1.0.0)
            // Expected if it DOESN'T work: same as wrong (has #23, missing #19) since cprev-1.0.2-wrong is now published at 1.0.2
            const right_works = r102_right.has(19) && r102_right.has(22) && r102_right.has(23);
            const right_anchored_at_wrong = r102_right.has(23) && !r102_right.has(19);

            const fmt = (b) => b ? '✅' : '❌';
            let rightVerdict;
            if (right_works) {
              rightVerdict = '✅ WORKS — config previous-tag correctly anchored at cprev-1.0.0 (includes #19-#22)';
            } else if (right_anchored_at_wrong) {
              rightVerdict = '❌ DOES NOT WORK — anchored at cprev-1.0.2-wrong (highest published), config previous-tag ignored';
            } else {
              rightVerdict = `❌ DOES NOT WORK — unexpected result: #19=${r102_right.has(19)}, #22=${r102_right.has(22)}, #23=${r102_right.has(23)}`;
            }

            await core.summary
              .addHeading('Rollback Simulation — config previous-tag')
              .addRaw('<p>Tests whether <code>previous-tag</code> in <code>release-drafter.yml</code> config correctly anchors the post-rollback changelog.</p>')
              .addTable([
                [
                  {data:'Release',header:true},
                  {data:'Anchor method',header:true},
                  {data:'PR #19 (rolled-back range)',header:true},
                  {data:'PR #22 (rolled-back range)',header:true},
                  {data:'PR #23 (post-rollback)',header:true},
                  {data:'Verdict',header:true},
                ],
                ['cprev-1.0.0','(first release — no anchor)','—','—','—','✅ baseline'],
                [
                  'cprev-1.0.1', 'from: cprev-1.0.0',
                  fmt(r101.has(19)), fmt(r101.has(22)), `${fmt(!r101.has(23))} N/A`,
                  rolledBack ? '⏪ rolled-back' : '❓',
                ],
                [
                  'cprev-1.0.2-wrong', 'from: cprev-1.0.1 (wrong anchor after rollback)',
                  fmt(r102_wrong.has(19)), fmt(r102_wrong.has(22)), fmt(r102_wrong.has(23)),
                  wrong_correct ? '✅ correctly shows wrong behavior (PRs #19-#22 missing)' : '❓',
                ],
                [
                  'cprev-1.0.2-right', 'previous-tag: cprev-1.0.0 in config, no from: input',
                  fmt(r102_right.has(19)), fmt(r102_right.has(22)), fmt(r102_right.has(23)),
                  rightVerdict,
                ],
              ])
              .addHeading('Conclusion', 3)
              .addRaw(right_works
                ? '✅ <strong>previous-tag in config WORKS</strong> — correctly anchors at the rollback target. Trade-off: manual config edit required after every rollback.'
                : `❌ <strong>previous-tag in config does NOT work</strong> at pinned SHA <code>f259c0a</code>. Config option is ignored; release-drafter falls back to its default anchor (highest-semver published release = cprev-1.0.2-wrong). Only the <code>from:</code> action input (unreleased at this SHA) solves rollback-aware anchoring correctly.`)
              .addEOL()
              .addLink('cprev-1.0.2-wrong', r102_wrong.url)
              .addRaw(' · ')
              .addLink('cprev-1.0.2-right', r102_right.url)
              .write();

            if (!r101_correct) core.setFailed(`cprev-1.0.1 changelog wrong: #19=${r101.has(19)} #22=${r101.has(22)}`);
            if (!rolledBack)   core.setFailed(`cprev-1.0.1 rollout status does not show rolled-back`);

      # ── Cleanup ───────────────────────────────────────────────────────────────
      - name: Cleanup — restore rd workflows and delete test config
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // Get current HEAD
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const headSha = ref.object.sha;
            const { data: headCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: headSha });

            // Build tree entries: restore saved workflows + delete test config
            const saved = JSON.parse(process.env.RD_SAVED_FILES || '{}');
            const treeEntries = [];

            for (const [path, content] of Object.entries(saved)) {
              const { data: blob } = await github.rest.git.createBlob({
                owner, repo,
                content: Buffer.from(content).toString('base64'),
                encoding: 'base64',
              });
              treeEntries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
            }

            // Delete test config file
            const configPath = `.github/${process.env.CONFIG_NAME}`;
            try {
              await github.rest.repos.getContent({ owner, repo, path: configPath });
              treeEntries.push({ path: configPath, mode: '100644', type: 'blob', sha: null });
            } catch { core.info(`Test config already gone`); }

            if (treeEntries.length === 0) {
              core.info('Nothing to restore/delete');
              return;
            }

            const { data: newTree } = await github.rest.git.createTree({
              owner, repo, base_tree: headCommit.tree.sha, tree: treeEntries,
            });
            const { data: newCommit } = await github.rest.git.createCommit({
              owner, repo,
              message: 'test: restore rd workflows and remove cprev simulation config',
              tree: newTree.sha,
              parents: [headSha],
            });
            await github.rest.git.updateRef({ owner, repo, ref: 'heads/main', sha: newCommit.sha });
            core.info(`Restored ${Object.keys(saved).length} workflows, deleted test config in ${newCommit.sha}`);

      - name: Cleanup — delete sim releases and tags
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tags = [
              process.env.TAG_100, process.env.TAG_101,
              process.env.TAG_102_WRONG, process.env.TAG_102_RIGHT,
            ];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const tag of tags) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Cleaned ${tag}`);
              } catch { core.info(`${tag} already gone`); }
            }
