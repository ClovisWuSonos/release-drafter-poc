name: Simulate Rollback — config previous-tag

# Tests whether setting `previous-tag` in release-drafter.yml (config file)
# correctly anchors the post-rollback changelog.
#
# previous-tag as a config option is STATIC — it must be manually updated
# after each rollback. This simulation demonstrates that flow end-to-end.
#
# Timeline:
#   cprev-1.0.0       — good baseline, tagged at d275ebe (after PR #18)
#   cprev-1.0.1       — bad release,   tagged at 4676fbe (after PR #22), gets rolled back
#   cprev-1.0.2-wrong — drafted WITHOUT previous-tag in config → wrong anchor (cprev-1.0.1)
#   cprev-1.0.2-right — drafted WITH  previous-tag: cprev-1.0.0 in config → correct anchor
#
# PR distribution:
#   cprev-1.0.0 → cprev-1.0.1 : PRs #19, #20, #21, #22  ← "lost" PRs after rollback
#   cprev-1.0.1 → HEAD         : PRs #23–#31
#   cprev-1.0.0 → HEAD         : PRs #19–#31             ← correct range
#
# Key assertions:
#   cprev-1.0.2-wrong: missing PRs #19–#22 (anchored at bad release)
#   cprev-1.0.2-right: includes PRs #19–#31 (anchored at rollback target)

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

env:
  CONFIG_NAME: release-drafter-cprev-test.yml
  TAG_100: cprev-1.0.0
  TAG_101: cprev-1.0.1
  TAG_102_WRONG: cprev-1.0.2-wrong
  TAG_102_RIGHT: cprev-1.0.2-right
  COMMIT_100: d275ebe484a594977e744c4f34e5a076d3a6bef9
  COMMIT_101: 4676fbe6e14a43be32295279d5e3cb3b37bee5a7
  RD_SHA: f259c0ada5376557cd49e74487398301fab5287a

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:

      # ── Cleanup leftovers from prior runs ────────────────────────────────────
      - name: Cleanup prior sim releases and tags
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tags = [
              process.env.TAG_100, process.env.TAG_101,
              process.env.TAG_102_WRONG, process.env.TAG_102_RIGHT,
            ];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const tag of tags) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted release ${tag}`);
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Deleted tag ${tag}`);
              } catch { core.info(`Tag ${tag} did not exist`); }
            }

      # ── Create test config (no previous-tag) ─────────────────────────────────
      - name: Create test release-drafter config (no previous-tag)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = `.github/${process.env.CONFIG_NAME}`;
            const content = [
              `name-template: 'Config PrevTag $RESOLVED_VERSION'`,
              `tag-template: 'cprev-$RESOLVED_VERSION'`,
              `change-template: '- $TITLE (#$NUMBER, @$AUTHOR)'`,
              ``,
              `categories:`,
              `  - title: '🚀 Features'`,
              `    labels:`,
              `      - 'feature'`,
              `      - 'enhancement'`,
              `  - title: '🐛 Bug Fixes'`,
              `    labels:`,
              `      - 'fix'`,
              `      - 'bugfix'`,
              `      - 'bug'`,
              `  - title: '🧰 Maintenance'`,
              `    labels:`,
              `      - 'chore'`,
              ``,
              `template: |`,
              `  ## Changes`,
              ``,
              `  $CHANGES`,
            ].join('\n');

            // Check if file already exists (from a previous partial run)
            let sha;
            try {
              const { data: existing } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path,
              });
              sha = existing.sha;
              core.info(`Updating existing config at ${path}`);
            } catch {
              core.info(`Creating new config at ${path}`);
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path,
              message: `test: create release-drafter config for cprev simulation`,
              content: Buffer.from(content).toString('base64'),
              ...(sha ? { sha } : {}),
            });
            core.info(`Config created at ${path}`);

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 1 — cprev-1.0.0 (good baseline)
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 1 — create tag cprev-1.0.0"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_100}`,
              sha: process.env.COMMIT_100,
            });
            core.info(`Tagged ${process.env.TAG_100} at ${process.env.COMMIT_100}`);

      - name: "Rel 1 — draft changelog (first release, no anchor)"
        id: draft-100
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ env.COMMIT_100 }}
          tag: ${{ env.TAG_100 }}
          version: "1.0.0"
          name: "Config PrevTag 1.0.0"
          config-name: ${{ env.CONFIG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 1 — inject rollout status (complete)"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-100.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            const START = '<!-- rollout-status:start -->';
            const END   = '<!-- rollout-status:end -->';
            const block = `${START}\n## Rollout Status\n\nus-east-1: ✅ complete\neu-west-1: ✅ complete\n${END}`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id,
              body: `${rel.body ?? ''}\n\n${block}`,
            });
            core.info(`Injected rollout status into ${rel.tag_name}`);

      - name: "Rel 1 — publish and mark --latest"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-100.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false, make_latest: 'true',
            });
            core.info(`Published ${process.env.TAG_100} and marked --latest`);

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 2 — cprev-1.0.1 (bad release — will be rolled back)
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rel 2 — create tag cprev-1.0.1"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_101}`,
              sha: process.env.COMMIT_101,
            });
            core.info(`Tagged ${process.env.TAG_101} at ${process.env.COMMIT_101}`);

      - name: "Rel 2 — draft changelog (from: cprev-1.0.0 → PRs #19 #20 #21 #22)"
        id: draft-101
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ env.COMMIT_101 }}
          tag: ${{ env.TAG_101 }}
          version: "1.0.1"
          name: "Config PrevTag 1.0.1"
          config-name: ${{ env.CONFIG_NAME }}
          from: ${{ env.TAG_100 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 2 — inject rollout status (complete)"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-101.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            const START = '<!-- rollout-status:start -->';
            const END   = '<!-- rollout-status:end -->';
            const block = `${START}\n## Rollout Status\n\nus-east-1: ✅ complete\neu-west-1: ✅ complete\n${END}`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id,
              body: `${rel.body ?? ''}\n\n${block}`,
            });
            core.info(`Injected rollout status into ${rel.tag_name}`);

      - name: "Rel 2 — publish and mark --latest"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-101.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false, make_latest: 'true',
            });
            core.info(`Published ${process.env.TAG_101} and marked --latest`);

      # ════════════════════════════════════════════════════════════════════════
      # ROLLBACK — cprev-1.0.1 → cprev-1.0.0
      # ════════════════════════════════════════════════════════════════════════

      - name: "Rollback — update cprev-1.0.1 rollout status to rolled-back"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-101.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rollbackTo = process.env.TAG_100;
            const { data: rel } = await github.rest.repos.getRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            const body = (rel.body ?? '')
              .replace('us-east-1: ✅ complete', `us-east-1: ⏪ rolled-back → ${rollbackTo}`)
              .replace('eu-west-1: ✅ complete', `eu-west-1: ⏪ rolled-back → ${rollbackTo}`);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, body,
            });
            core.info(`Marked ${process.env.TAG_101} as rolled-back → ${rollbackTo}`);

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 3 WRONG — explicit wrong anchor (cprev-1.0.1)
      # Simulates post-rollback deploy with no config override: from: cprev-1.0.1
      # → misses the rolled-back range (PRs #19-#22)
      # ════════════════════════════════════════════════════════════════════════

      # Delete any floating draft from release-drafter-simplified.yml so it
      # doesn't interfere with the anchor lookup in this step.
      - name: "Pre Rel 3 WRONG — delete floating drafts"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const rel of releases) {
              if (rel.draft && !rel.tag_name.startsWith('cprev-')) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted floating draft: ${rel.tag_name || '(untagged)'}`);
              }
            }

      - name: "Rel 3 WRONG — create tag cprev-1.0.2-wrong at HEAD"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_102_WRONG}`,
              sha: context.sha,
            });
            core.info(`Tagged ${process.env.TAG_102_WRONG} at ${context.sha}`);

      - name: "Rel 3 WRONG — draft (from: cprev-1.0.1 — wrong anchor after rollback)"
        id: draft-102-wrong
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ github.sha }}
          tag: ${{ env.TAG_102_WRONG }}
          version: "1.0.2"
          name: "Config PrevTag 1.0.2 — WRONG (anchored at bad release)"
          config-name: ${{ env.CONFIG_NAME }}
          from: ${{ env.TAG_101 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep cprev-1.0.2-wrong as a DRAFT so it doesn't become the anchor
      # for the cprev-1.0.2-right step. If published, right would see
      # cprev-1.0.2-wrong as the highest-semver release and anchor there
      # (same SHA → no commits → no changes).
      - name: "Rel 3 WRONG — leave as draft (intentional)"
        run: echo "cprev-1.0.2-wrong left as draft — keeps cprev-1.0.1 as the anchor for the right step"

      # ════════════════════════════════════════════════════════════════════════
      # MANUAL OPERATION — update config to add previous-tag: cprev-1.0.0
      # In real usage this would be a manual PR/commit to release-drafter.yml.
      # Here we simulate it via the GitHub API.
      # ════════════════════════════════════════════════════════════════════════

      - name: "Manual op — add previous-tag: cprev-1.0.0 to config"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = `.github/${process.env.CONFIG_NAME}`;
            const { data: existing } = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo, path,
            });
            const currentContent = Buffer.from(existing.content, 'base64').toString();

            // Prepend previous-tag after the first line (name-template line)
            const lines = currentContent.split('\n');
            lines.splice(1, 0, `previous-tag: '${process.env.TAG_100}'`);
            const newContent = lines.join('\n');

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path,
              message: `manual: set previous-tag to ${process.env.TAG_100} after rollback`,
              content: Buffer.from(newContent).toString('base64'),
              sha: existing.sha,
            });
            core.info(`Updated config: added previous-tag: ${process.env.TAG_100}`);
            core.info(`New config:\n${newContent}`);

      # ════════════════════════════════════════════════════════════════════════
      # RELEASE 3 RIGHT — with previous-tag: cprev-1.0.0 in config
      # Anchors to cprev-1.0.0 (the rollback target) — correct
      # ════════════════════════════════════════════════════════════════════════

      # Delete any floating draft again (the manual-op commit may have triggered
      # release-drafter-simplified.yml between the two steps).
      - name: "Pre Rel 3 RIGHT — delete floating drafts"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const rel of releases) {
              if (rel.draft && !rel.tag_name.startsWith('cprev-')) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted floating draft: ${rel.tag_name || '(untagged)'}`);
              }
            }

      - name: "Rel 3 RIGHT — create tag cprev-1.0.2-right at HEAD"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${process.env.TAG_102_RIGHT}`,
              sha: context.sha,
            });
            core.info(`Tagged ${process.env.TAG_102_RIGHT} at ${context.sha}`);

      - name: "Rel 3 RIGHT — draft (previous-tag: cprev-1.0.0 in config → correct anchor)"
        id: draft-102-right
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: false
          commitish: ${{ github.sha }}
          tag: ${{ env.TAG_102_RIGHT }}
          version: "1.0.2"
          name: "Config PrevTag 1.0.2 — RIGHT (config previous-tag set)"
          config-name: ${{ env.CONFIG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Rel 3 RIGHT — publish"
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.draft-102-right.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
            core.info(`Published ${process.env.TAG_102_RIGHT}`);

      # ════════════════════════════════════════════════════════════════════════
      # ASSERT + SUMMARY
      # ════════════════════════════════════════════════════════════════════════

      - name: Assert changelogs and write summary
        uses: actions/github-script@v7
        env:
          ID_100: ${{ steps.draft-100.outputs.id }}
          ID_101: ${{ steps.draft-101.outputs.id }}
          ID_102_WRONG: ${{ steps.draft-102-wrong.outputs.id }}
          ID_102_RIGHT: ${{ steps.draft-102-right.outputs.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const get = async (id) => {
              const { data: rel } = await github.rest.repos.getRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: Number(id),
              });
              const body = rel.body || '';
              return { url: rel.html_url, tag: rel.tag_name, body, has: (n) => body.includes(`#${n}`) };
            };

            const r100       = await get(process.env.ID_100);
            const r101       = await get(process.env.ID_101);
            const r102_wrong = await get(process.env.ID_102_WRONG);
            const r102_right = await get(process.env.ID_102_RIGHT);

            core.info(`cprev-1.0.1 body:\n${r101.body}`);
            core.info(`cprev-1.0.2-wrong body:\n${r102_wrong.body}`);
            core.info(`cprev-1.0.2-right body:\n${r102_right.body}`);

            // cprev-1.0.1 should have PRs #19-#22 (between 1.0.0 and 1.0.1)
            const r101_correct = r101.has(19) && r101.has(22) && !r101.has(23);

            // cprev-1.0.2-wrong: from: cprev-1.0.1 (simulates wrong anchor after rollback)
            // Should have #23+ but NOT #19-#22 (missing the rolled-back range)
            // This release is kept as a draft so it doesn't pollute the right anchor.
            const wrong_has_new   = r102_wrong.has(23);
            const wrong_misses_rb = !r102_wrong.has(19) && !r102_wrong.has(22);
            const r102_wrong_ok   = wrong_has_new && wrong_misses_rb;

            // cprev-1.0.2-right: previous-tag in config = cprev-1.0.0, correct anchor
            // Should have #19-#31 (full range since rollback target)
            const r102_right_ok = r102_right.has(19) && r102_right.has(22) && r102_right.has(23);

            const rolledBack = r101.body.includes('rolled-back');
            const fmt = (b) => b ? '✅' : '❌';

            await core.summary
              .addHeading('Rollback Simulation — config previous-tag')
              .addRaw('<p>Tests whether <code>previous-tag</code> in <code>release-drafter.yml</code> config correctly anchors the post-rollback changelog.</p>')
              .addTable([
                [
                  {data:'Release',header:true},
                  {data:'Anchor method',header:true},
                  {data:'PR #19 (rolled-back range)',header:true},
                  {data:'PR #22 (rolled-back range)',header:true},
                  {data:'PR #23 (post-rollback)',header:true},
                  {data:'Verdict',header:true},
                ],
                [
                  'cprev-1.0.0','(first release — no anchor)','—','—','—','✅ baseline',
                ],
                [
                  'cprev-1.0.1',`from: cprev-1.0.0`,
                  fmt(r101.has(19)), fmt(r101.has(22)), `${fmt(!r101.has(23))} N/A`,
                  rolledBack ? '⏪ rolled-back' : '❓',
                ],
                [
                  'cprev-1.0.2-wrong','from: cprev-1.0.1 (simulates deploy after rollback, wrong anchor)',
                  fmt(r102_wrong.has(19)), fmt(r102_wrong.has(22)), fmt(r102_wrong.has(23)),
                  r102_wrong_ok
                    ? '✅ correctly shows the wrong behavior (PRs #19-#22 missing)'
                    : '❓ unexpected result',
                ],
                [
                  'cprev-1.0.2-right','previous-tag: cprev-1.0.0 in config (manual op after rollback)',
                  fmt(r102_right.has(19)), fmt(r102_right.has(22)), fmt(r102_right.has(23)),
                  r102_right_ok
                    ? '✅ correct (anchored at cprev-1.0.0, includes rolled-back PRs)'
                    : '❌ wrong (previous-tag in config did not override anchor)',
                ],
              ])
              .addHeading('Conclusion', 3)
              .addRaw(r102_right_ok
                ? '✅ <strong>previous-tag in config WORKS</strong> — correctly anchors at the rollback target. <br>Trade-off: requires a manual config file edit after every rollback. No action-input equivalent exists in any officially released version.'
                : '❌ <strong>previous-tag in config does NOT work</strong> — config option did not override the default anchor. Only the <code>from:</code> action input (unreleased) solves this correctly.')
              .addEOL()
              .addLink('cprev-1.0.2-wrong', r102_wrong.url)
              .addRaw(' · ')
              .addLink('cprev-1.0.2-right', r102_right.url)
              .write();

            if (!r101_correct)    core.setFailed(`cprev-1.0.1 changelog wrong: #19=${r101.has(19)} #22=${r101.has(22)}`);
            if (!rolledBack)      core.setFailed(`cprev-1.0.1 rollout status does not show rolled-back`);
            if (!r102_right_ok)   core.setFailed(`cprev-1.0.2-right: previous-tag in config did not anchor at cprev-1.0.0`);

      # ── Cleanup ───────────────────────────────────────────────────────────────
      - name: Cleanup — delete test config file
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = `.github/${process.env.CONFIG_NAME}`;
            try {
              const { data: existing } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path,
              });
              await github.rest.repos.deleteFile({
                owner: context.repo.owner, repo: context.repo.repo,
                path,
                message: `test: remove cprev simulation config`,
                sha: existing.sha,
              });
              core.info(`Deleted ${path}`);
            } catch (e) {
              core.info(`Config already gone or error: ${e.message}`);
            }

      - name: Cleanup — delete sim releases and tags
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tags = [
              process.env.TAG_100, process.env.TAG_101,
              process.env.TAG_102_WRONG, process.env.TAG_102_RIGHT,
            ];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const tag of tags) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted release ${tag}`);
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Deleted tag ${tag}`);
              } catch { core.info(`Tag ${tag} already gone`); }
            }
