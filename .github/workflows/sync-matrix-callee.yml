# POC ONLY: stub of argo-rollback-test-java's job graph. The `if:` conditions of get-current, rollback-deploy,
# verify-current and sync-github-releases are copied VERBATIM from the real workflow; job bodies are stubs
# (fake version outputs, echo instead of release mutation). Fails if sync's run/skip result != expect_sync.
name: sync-matrix-callee
on:
  workflow_call:
    inputs:
      environment:  { type: string, required: true }
      argo_name:    { type: string, required: true }
      prev_version: { type: string, required: true }
      cur_version:  { type: string, required: true }
      deploy_state: { type: string, required: true }   # success | failure | crash
      verify_version: { type: string, required: true }
      expect_sync:  { type: string, required: true }   # 'true' | 'false'
jobs:
  get-argo-service-name:
    runs-on: ubuntu-latest
    outputs: { argo-service-name: "${{ inputs.argo_name }}" }
    steps: [{ run: "echo stub" }]
  resolve-previous:
    runs-on: ubuntu-latest
    outputs: { version: "${{ inputs.prev_version }}" }
    steps: [{ run: "echo stub" }]
  get-current:
    needs: [get-argo-service-name]
    if: ${{ inputs.environment == 'prod' && !endsWith(needs.get-argo-service-name.outputs.argo-service-name, '-canary') }}
    runs-on: ubuntu-latest
    outputs: { version: "${{ inputs.cur_version }}" }
    steps: [{ run: "echo stub" }]
  rollback-deploy:
    needs: [resolve-previous, get-argo-service-name, get-current]
    if: ${{ !cancelled() && needs.resolve-previous.result == 'success' }}
    runs-on: ubuntu-latest
    outputs: { final-state: "${{ steps.s.outputs.final-state }}" }
    steps:
      - id: s
        env: { S: "${{ inputs.deploy_state }}" }
        run: |
          [ "$S" = crash ] && { echo "simulated job crash"; exit 1; }
          echo "final-state=$S" >> "$GITHUB_OUTPUT"
  verify-current:
    needs: [rollback-deploy, resolve-previous, get-argo-service-name, get-current]
    if: ${{ !cancelled() && needs.get-current.result == 'success' && needs.rollback-deploy.outputs.final-state == 'success' && needs.get-current.outputs.version != needs.resolve-previous.outputs.version }}
    runs-on: ubuntu-latest
    outputs: { version: "${{ inputs.verify_version }}" }
    steps: [{ run: "echo stub" }]
  sync-github-releases:
    needs: [resolve-previous, get-current, verify-current]
    if: ${{ !cancelled() && needs.verify-current.result == 'success' && needs.verify-current.outputs.version == needs.resolve-previous.outputs.version }}
    runs-on: ubuntu-latest
    steps: [{ run: "echo STUB would promote and annotate - nothing real happens" }]
  assert:
    needs: [sync-github-releases]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.sync-github-releases.result }}
          EXPECT: ${{ inputs.expect_sync }}
        run: |
          ran=true; [ "$RESULT" = skipped ] && ran=false
          echo "sync result=$RESULT ran=$ran expected=$EXPECT"
          [ "$ran" = "$EXPECT" ] || { echo "::error::sync ran=$ran but expected $EXPECT"; exit 1; }
