name: conc-rollback
on:
  push:
    branches: [test/SWPBL-273052-rollback-harness]
permissions:
  actions: read
  checks: write
  contents: write
  id-token: write
  packages: read
  pull-requests: write
jobs:
  rollback:
    uses: ./.github/workflows/rollback-harness.yml
    with:
      service: poc-conc
      environment: prod
      region: us-east-1
      team: poc
      stub-current-version: '1.0.5'
      stub-previous-version: '1.0.4'
      stub-final-state: success
