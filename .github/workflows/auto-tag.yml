name: Auto Tag on Merge

# Simulates constraint #1 from the real architecture: every merge to main
# immediately gets its own git tag (cloud-settings-X.Y.Z) pointing at the
# exact merge commit. This tag is what anchors the release-drafter "publish"
# step later to the correct commit, no matter what happens on main afterwards.
#
# NOTE: this workflow is not one of the 4 files you asked for — it's scaffolding
# needed so the POC has real tags to publish against. See README for why.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch version and create+push tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force

          LATEST=$(git tag --list 'cloud-settings-*' \
            | sed 's/cloud-settings-//' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n1)

          if [ -z "$LATEST" ]; then
            NEW_VERSION="1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          NEW_TAG="cloud-settings-${NEW_VERSION}"
          COMMIT_SHA="${{ github.sha }}"

          echo "Latest tag found: ${LATEST:-<none>}"
          echo "Creating tag ${NEW_TAG} at commit ${COMMIT_SHA}"

          git tag "$NEW_TAG" "$COMMIT_SHA"
          git push origin "$NEW_TAG"

          {
            echo "### 🏷️ Tagged \`${NEW_TAG}\`"
            echo "Commit: \`${COMMIT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
