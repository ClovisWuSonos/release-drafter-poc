name: test-rollback-harness (SWPBL-273052 POC)
on:
  push:
    branches: [test/SWPBL-273052-rollback-harness]
  workflow_dispatch:
permissions:
  actions: read
  checks: write
  contents: write
  id-token: write
  packages: read
  pull-requests: write
jobs:
  s-prod-normal:
    uses: ./.github/workflows/rollback-harness.yml
    with:
      service: "poc-a"
      argo-service-name: ""
      environment: prod
      region: "us-east-1"
      team: poc
      tag-prefix: "v"
      stub-current-version: "1.0.5"
      stub-previous-version: "1.0.4"
      stub-final-state: success
  s-prod-bare-tags:
    uses: ./.github/workflows/rollback-harness.yml
    with:
      service: "poc-b"
      argo-service-name: ""
      environment: prod
      region: "eu-west-1"
      team: poc
      tag-prefix: ""
      stub-current-version: "2.0.0"
      stub-previous-version: "1.9.0"
      stub-final-state: success
  s-prod-same-version:
    uses: ./.github/workflows/rollback-harness.yml
    with:
      service: "poc-c"
      argo-service-name: ""
      environment: prod
      region: "us-east-1"
      team: poc
      tag-prefix: "v"
      stub-current-version: "1.0.4"
      stub-previous-version: "1.0.4"
      stub-final-state: success
  s-prod-canary:
    uses: ./.github/workflows/rollback-harness.yml
    with:
      service: "poc-d"
      argo-service-name: "poc-d-canary"
      environment: prod
      region: "us-east-1"
      team: poc
      tag-prefix: "v"
      stub-current-version: "1.0.5"
      stub-previous-version: "1.0.4"
      stub-final-state: success
  s-stage-nonprod:
    uses: ./.github/workflows/rollback-harness.yml
    with:
      service: "poc-e"
      argo-service-name: ""
      environment: stage
      region: "us-east-1"
      team: poc
      tag-prefix: "v"
      stub-current-version: "1.0.5"
      stub-previous-version: "1.0.4"
      stub-final-state: success
  s-prod-deploy-failed:
    uses: ./.github/workflows/rollback-harness.yml
    with:
      service: "poc-f"
      argo-service-name: ""
      environment: prod
      region: "us-east-1"
      team: poc
      tag-prefix: "v"
      stub-current-version: "1.0.5"
      stub-previous-version: "1.0.4"
      stub-final-state: failure
  assert:
    needs: [s-prod-normal, s-prod-bare-tags, s-prod-same-version, s-prod-canary, s-stage-nonprod, s-prod-deploy-failed]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert every scenario
        env:
          R_prod_normal: ${{ needs.s-prod-normal.result }}
          O_prod_normal: ${{ needs.s-prod-normal.outputs.results }}
          R_prod_bare_tags: ${{ needs.s-prod-bare-tags.result }}
          O_prod_bare_tags: ${{ needs.s-prod-bare-tags.outputs.results }}
          R_prod_same_version: ${{ needs.s-prod-same-version.result }}
          O_prod_same_version: ${{ needs.s-prod-same-version.outputs.results }}
          R_prod_canary: ${{ needs.s-prod-canary.result }}
          O_prod_canary: ${{ needs.s-prod-canary.outputs.results }}
          R_stage_nonprod: ${{ needs.s-stage-nonprod.result }}
          O_stage_nonprod: ${{ needs.s-stage-nonprod.outputs.results }}
          R_prod_deploy_failed: ${{ needs.s-prod-deploy-failed.result }}
          O_prod_deploy_failed: ${{ needs.s-prod-deploy-failed.outputs.results }}
        run: |
          fail=0
          chk() { # name want-result output expected...
            local n="$1" want="$2" res="$3" out="$4"; shift 4
            if [ "$res" != "$want" ]; then echo "FAIL $n: workflow result '$res', wanted '$want'"; fail=1; return; fi
            for e in "$@"; do case "$out" in *"$e"*) ;; *) echo "FAIL $n: missing '$e' in: $out"; fail=1; return;; esac; done
            echo "PASS $n"
          }
          chk prod-normal success "$R_prod_normal" "$O_prod_normal" 'validate-region=success' 'get-argo-service-name=success' 'get-current=success' 'resolve-previous=success' 'rollback-deploy=success' 'sync-github-releases=success' 'promote:v1.0.4 annotate:v1.0.5 revert-to:v1.0.4'
          chk prod-bare-tags success "$R_prod_bare_tags" "$O_prod_bare_tags" 'sync-github-releases=success' 'promote:1.9.0 annotate:2.0.0 revert-to:1.9.0' '"region":"eu-west-1"'
          chk prod-same-version success "$R_prod_same_version" "$O_prod_same_version" 'get-current=success' 'rollback-deploy=success' 'sync-github-releases=skipped'
          chk prod-canary success "$R_prod_canary" "$O_prod_canary" 'get-current=skipped' 'rollback-deploy=success' 'sync-github-releases=skipped'
          chk stage-nonprod success "$R_stage_nonprod" "$O_stage_nonprod" 'get-current=skipped' 'rollback-deploy=success' 'sync-github-releases=skipped'
          chk prod-deploy-failed success "$R_prod_deploy_failed" "$O_prod_deploy_failed" 'get-current=success' 'rollback-deploy=success' 'sync-github-releases=skipped'
          exit $fail
  negative-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Real validation scripts accept good input and reject bad input
        run: |
          cat > val-region.sh <<'EOS'
          # Validate region: a single valid region name
          if [[ ! "$INPUT_REGION" =~ ^[A-Za-z0-9._-]+$ || "$INPUT_REGION" == "all" ]]; then
            echo "::error::region must be a single region for rollback (got '${INPUT_REGION}'). 'all' is not supported because previous versions can differ per region."
            exit 1
          fi
          echo "Rollback region: ${INPUT_REGION}"
          EOS
          cat > val-svc.sh <<'EOS'
          argo_svc="$INPUT_ARGO_SERVICE_NAME"
          if [ -z "$argo_svc" ]; then
            argo_svc="$INPUT_SERVICE"
          fi
          # Validate Argo service name: only letters, numbers, dot, underscore and hyphen.
          if [[ ! "$argo_svc" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::argo service name is invalid."
            exit 1
          fi
          echo "name=${argo_svc}" >> "$GITHUB_OUTPUT"
          echo "Using Argo service name: ${argo_svc}"
          EOS
          fail=0
          region() { rc=0; INPUT_REGION="$1" INPUT_TAG_PREFIX="${3:-}" bash -e val-region.sh >/dev/null 2>&1 || rc=$?; if { [ "$2" = ok ] && [ $rc -eq 0 ]; } || { [ "$2" = bad ] && [ $rc -ne 0 ]; }; then echo "PASS region [$1] -> $2"; else echo "FAIL region [$1] wanted $2 got rc=$rc"; fail=1; fi; }
          svc() { rc=0; INPUT_SERVICE="$1" INPUT_ARGO_SERVICE_NAME="$2" GITHUB_OUTPUT=/dev/null bash -e val-svc.sh >/dev/null 2>&1 || rc=$?; if { [ "$3" = ok ] && [ $rc -eq 0 ]; } || { [ "$3" = bad ] && [ $rc -ne 0 ]; }; then echo "PASS service [$1|$2] -> $3"; else echo "FAIL service [$1|$2] wanted $3 got rc=$rc"; fail=1; fi; }
          region us-east-1 ok; region eu-west-2 ok; region us-gov-west-1 ok
          region 'us-east-1;id' bad; region 'a$(id)' bad; region 'a b' bad; region 'a|b' bad; region all bad; region '' bad
          region "$(printf 'us-east-1\nx')" bad
          region us-east-1 ok v; region us-east-1 ok authz-thor-; region us-east-1 ok a/b-; region us-east-1 ok ''

          svc my-svc '' ok; svc my-svc my-svc-canary ok; svc svc.v2_x '' ok
          svc 'x;id' '' bad; svc my-svc 'x y' bad; svc my-svc '$(id)' bad; svc '' '' bad
          exit $fail
