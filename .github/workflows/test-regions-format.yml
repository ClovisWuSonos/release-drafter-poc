name: Test Regions Format for Footer

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Regions input — try JSON [\"us-east-1\",\"eu-west-1\"] or comma-separated us-east-1,eu-west-1"
        type: string
        required: true

permissions:
  contents: write

jobs:
  option-1-json:
    name: "Option 1: JSON array"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: build-footer
        env:
          REGIONS: ${{ inputs.regions }}
        with:
          result-encoding: string
          script: |
            const regions = JSON.parse(process.env.REGIONS);
            const rows = regions.map(r => `${r}: ✅ complete`).join('
');
            return `<!-- rollout-status:start -->
## Rollout Status

${rows}
<!-- rollout-status:end -->`;

      - name: Publish release (JSON footer)
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: true
          tag: test-json-${{ github.run_number }}
          name: "Test JSON regions ${{ github.run_number }}"
          footer: ${{ steps.build-footer.outputs.result }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  option-2-comma:
    name: "Option 2: Comma-separated"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: build-footer
        env:
          REGIONS: ${{ inputs.regions }}
        with:
          result-encoding: string
          script: |
            const regions = process.env.REGIONS.split(',').map(r => r.trim());
            const rows = regions.map(r => `${r}: ✅ complete`).join('
');
            return `<!-- rollout-status:start -->
## Rollout Status

${rows}
<!-- rollout-status:end -->`;

      - name: Publish release (comma footer)
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: true
          tag: test-comma-${{ github.run_number }}
          name: "Test comma regions ${{ github.run_number }}"
          footer: ${{ steps.build-footer.outputs.result }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
