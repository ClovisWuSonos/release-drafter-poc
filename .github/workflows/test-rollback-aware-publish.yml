name: Test Rollback-Aware Publish

# Runs both scenarios sequentially in one job so the state from Scenario A
# (cloud-settings-1.2.0 published) is guaranteed to exist when Scenario B runs.
#
# Scenario A — forward deploy:
#   Pin --latest to cloud-settings-1.1.12. Publish Cloud Settings 1.2.0.
#   Expected: changelog = PR #7 only (Critical hotfix after rollback).
#
# Scenario B — rollback:
#   Production rolled back: cloud-settings-1.2.0 → cloud-settings-1.1.10.
#   Update cloud-settings-1.2.0 footer to show it was rolled back.
#   Publish Cloud Settings 1.2.1 anchored from cloud-settings-1.1.10.
#   Expected: changelog = PRs #5 #6 #7 (all changes since 1.1.10).
#   Without `from`: would anchor to 1.1.12 (highest semver) and show only #7.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      # ──────────────────────────────────────────────────────────────────────
      # Setup: delete 1.2.0 and 1.2.1 so each run starts clean
      # (test idempotency only — production deploy workflows never delete releases)
      # ──────────────────────────────────────────────────────────────────────
      - name: Reset test releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const candidates = ['cloud-settings-1.2.0', 'cloud-settings-1.2.1'];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            for (const tag of candidates) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted release ${tag}`);
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Deleted tag ${tag}`);
              } catch { core.info(`Tag ${tag} did not exist`); }
            }

      # ──────────────────────────────────────────────────────────────────────
      # Scenario A: forward deploy from cloud-settings-1.1.12
      # ──────────────────────────────────────────────────────────────────────
      - name: "Scenario A — pin --latest to cloud-settings-1.1.12"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            const rel = releases.find(r => r.tag_name === 'cloud-settings-1.1.12');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, make_latest: 'true',
            });
            core.info('Pinned --latest → cloud-settings-1.1.12');

      - name: "Scenario A — get --latest tag"
        id: latest-a
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner, repo: context.repo.repo,
            });
            core.info(`--latest: ${data.tag_name}`);
            core.setOutput('tag', data.tag_name);

      - name: "Scenario A — publish Cloud Settings 1.2.0"
        id: publish-a
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: ${{ steps.latest-a.outputs.tag }}
          version: "1.2.0"
          tag: "cloud-settings-1.2.0"
          name: "Cloud Settings 1.2.0"
          footer: |
            ---
            ## 🚀 Rollout Status
            | Region | Status |
            |---|---|
            | us-east-1 | ✅ Success |
            | eu-west-1 | ✅ Success |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario A — verify changelog"
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.publish-a.outputs.tag_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            const body = rel.body || '';
            core.info(`Scenario A body:\n${body}`);
            await core.summary.addHeading('Scenario A — Forward Deploy (cloud-settings-1.2.0)')
              .addLink('View release', rel.html_url)
              .addCodeBlock(body, 'markdown').write();
            if (!body.includes('#7'))
              core.setFailed('FAIL: PR #7 missing from Scenario A changelog');
            else if (body.includes('#5') || body.includes('#6'))
              core.setFailed('FAIL: PRs #5/#6 should not appear in Scenario A (before the 1.1.12 anchor)');
            else
              core.info('✅ Scenario A PASS: changelog contains PR #7 only');

      # ──────────────────────────────────────────────────────────────────────
      # Scenario B: cloud-settings-1.2.0 rolled back to cloud-settings-1.1.10
      # ──────────────────────────────────────────────────────────────────────
      - name: "Scenario B — mark cloud-settings-1.2.0 as rolled back"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: 'cloud-settings-1.2.0',
            });
            const existingBody = rel.body || '';
            const separatorIdx = existingBody.indexOf('\n---\n');
            const changelogPart = separatorIdx !== -1
              ? existingBody.slice(0, separatorIdx) : existingBody;
            const newBody = `${changelogPart}
            ---
            ## 🔴 Rollout Status — This Release Was Rolled Back
            | Region | Status |
            |---|---|
            | us-east-1 | ⏪ Rolled Back |
            | eu-west-1 | ⏪ Rolled Back |

            _This release was rolled back in production. Superseded by cloud-settings-1.2.1, which re-ships these changes plus the hotfix._`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, body: newBody,
            });
            core.info('Marked cloud-settings-1.2.0 as rolled back');

      - name: "Scenario B — pin --latest back to cloud-settings-1.1.10"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            const rel = releases.find(r => r.tag_name === 'cloud-settings-1.1.10');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, make_latest: 'true',
            });
            core.info('Pinned --latest → cloud-settings-1.1.10');

      - name: "Scenario B — get --latest tag"
        id: latest-b
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner, repo: context.repo.repo,
            });
            core.info(`--latest: ${data.tag_name}`);
            core.setOutput('tag', data.tag_name);

      - name: "Scenario B — publish Cloud Settings 1.2.1"
        id: publish-b
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: ${{ steps.latest-b.outputs.tag }}
          version: "1.2.1"
          tag: "cloud-settings-1.2.1"
          name: "Cloud Settings 1.2.1"
          footer: |
            ---
            ## 🚀 Rollout Status
            | Region | Status |
            |---|---|
            | us-east-1 | ✅ Success |
            | eu-west-1 | ✅ Success |

            _Post-rollback fix release. cloud-settings-1.2.0 was rolled back to cloud-settings-1.1.10. This release re-ships all changes since 1.1.10._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario B — verify changelog"
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.publish-b.outputs.tag_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            const body = rel.body || '';
            core.info(`Scenario B body:\n${body}`);
            await core.summary.addHeading('Scenario B — Rollback (cloud-settings-1.2.1)')
              .addLink('View release', rel.html_url)
              .addCodeBlock(body, 'markdown').write();
            const missing = ['#5', '#6', '#7'].filter(n => !body.includes(n));
            if (missing.length > 0)
              core.setFailed(`FAIL: PRs ${missing.join(', ')} missing — rollback anchor not working`);
            else
              core.info('✅ Scenario B PASS: changelog spans PRs #5 #6 #7 (anchored to cloud-settings-1.1.10)');
