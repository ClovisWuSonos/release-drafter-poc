name: Test Rollback-Aware Publish

# Simulates three real-world deploy scenarios to validate the `from` input in
# release-drafter v7.10.0 (SHA 978bb0b30c5ee8cdd332ced253758157150d43f0).
#
# Three releases in repo history (tags at specific commits):
#
#   sim-stable-v1.0  (tagged at commit before PRs #1 #2 #4)
#     → represents the last known-good stable version
#
#   sim-bad-v1.1     (tagged after PRs #1 #2 #4 merged)
#     PRs in this release: #1 feat dark mode, #2 feat new settings, #4 feat dark mode
#     → bad version, released then rolled back
#
#   HEAD             (after PRs #5 #6 #7 merged)
#     PRs added since bad: #5 feat new settings, #6 fix config reload, #7 fix hotfix
#     → the fix/redeploy
#
# Scenarios:
#
#   A — Normal forward deploy, from: "" (empty):
#       getLatestRelease() = sim-bad-v1.1. Changelog = #5 #6 #7 (PRs since bad).
#       Validates: empty from is safe and anchors to latest as normal.
#
#   B — Post-rollback deploy, no from:
#       getLatestRelease() = sim-bad-v1.1 (rollback does NOT update getLatestRelease).
#       Changelog = #5 #6 #7 only. MISSING #1 #2 #4 (bad version's PRs). INCOMPLETE.
#       Demonstrates the bug: changelog omits the bad version's changes.
#
#   C — Post-rollback deploy, with from: sim-stable-v1.0:
#       Explicit anchor overrides getLatestRelease().
#       Changelog = #1 #2 #4 #5 #6 #7. COMPLETE.
#       Demonstrates the fix: all changes since stable are captured.
#
#   Final assert: C includes #1 #2 #4 (bad version PRs) which B misses.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

env:
  STABLE_TAG: sim-stable-v1.0
  BAD_TAG: sim-bad-v1.1
  STABLE_SHA: 62a27ad3e5a4edc00a911baa8945898fc656ef72
  BAD_SHA: 6c2ae374a354432ffd54fe8776bae1fc9653fc40

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      # ── Setup ──────────────────────────────────────────────────────────────
      # Delete all previous test releases so sim-bad-v1.1 ends up as the most
      # recently created published release — that's what getLatestRelease() returns.
      - name: "Setup — clean previous test releases"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const toDelete = [
              'sim-redeploy-a', 'sim-redeploy-b', 'sim-redeploy-c',
              'cloud-settings-test-a', 'cloud-settings-test-b1',
              'cloud-settings-test-b2', 'cloud-settings-test-c',
              'sim-bad-v1.1',
            ];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const tag of toDelete) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted release ${tag}`);
              }
              if (tag === 'sim-bad-v1.1') continue; // keep the tag, recreate release below
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Deleted tag ${tag}`);
              } catch { core.info(`Tag ${tag} did not exist`); }
            }

      # Recreate sim-bad-v1.1 as the most recently created published release.
      # getLatestRelease() returns the release with the highest created_at, so this
      # ensures Scenarios A and B anchor correctly to the bad version.
      - name: "Setup — recreate sim-bad-v1.1 as most-recent published release"
        uses: actions/github-script@v7
        env:
          BAD_TAG: ${{ env.BAD_TAG }}
          BAD_SHA: ${{ env.BAD_SHA }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.BAD_TAG,
              target_commitish: process.env.BAD_SHA,
              name: 'Cloud Settings 1.1 (bad — to be rolled back)',
              body: 'Bad release. Contains PRs: #1 dark mode, #2 new settings, #4 dark mode.\nThis version was rolled back.',
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            // Verify getLatestRelease returns it
            for (let i = 0; i < 5; i++) {
              const { data: latest } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner, repo: context.repo.repo,
              });
              if (latest.tag_name === process.env.BAD_TAG) {
                core.info(`✓ getLatestRelease() = ${latest.tag_name}`);
                return;
              }
              core.info(`getLatestRelease() = ${latest.tag_name}, retrying...`);
              await new Promise(r => setTimeout(r, 2000));
            }
            core.setFailed('getLatestRelease() did not return sim-bad-v1.1');

      # ── Scenario A — Normal deploy, from: "" (empty) ──────────────────────
      # getLatestRelease() = sim-bad-v1.1. from = "" → uses default anchor.
      # Expected: changelog = PRs after bad tag = #5 #6 #7.
      # Validates: empty from is safe (does not crash).
      - name: "Scenario A — publish sim-redeploy-a, from: '' (normal deploy, empty from)"
        id: publish-a
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: ""
          version: "2.0.0"
          tag: "sim-redeploy-a"
          name: "Redeploy A — normal deploy (from: empty)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario A — assert: empty from is safe, release created"
        id: assert-a
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag: 'sim-redeploy-a',
            });
            const body = rel.body || '';
            core.info(`A body:\n${body}`);
            const created = !!rel.tag_name;
            await core.summary
              .addHeading('Scenario A — Normal Deploy (from: "")')
              .addRaw('> `getLatestRelease()` = `sim-bad-v1.1` | `from` = `""` (empty) | Expected: PRs after bad version\n\n')
              .addTable([
                [{data:'Release created',header:true},{data:'#5 #6 #7 (fix PRs after bad)',header:true},{data:'Result',header:true}],
                [
                  created ? '✅ yes' : '❌ no',
                  [body.includes('#5'),body.includes('#6'),body.includes('#7')].every(Boolean) ? '✅ yes' : `has: ${[body.includes('#5')?'#5':'',body.includes('#6')?'#6':'',body.includes('#7')?'#7':''].filter(Boolean).join(' ') || 'none'}`,
                  created ? '✅ PASS — empty from is safe' : '❌ FAIL — release not created',
                ],
              ])
              .write();
            if (!created) core.setFailed('FAIL A: release not created with empty from');
            else core.info('✅ Scenario A PASS: empty from is safe');

      # ── Re-pin getLatestRelease to sim-bad-v1.1 (A publish moved it) ──────
      # Recreate sim-bad-v1.1 so its created_at is the most recent — that's what
      # getLatestRelease() sorts by. Deleting sim-redeploy-a alone leaves no
      # make_latest release and getLatestRelease returns 404.
      - name: "Re-pin sim-bad-v1.1 as latest after Scenario A"
        uses: actions/github-script@v7
        env:
          BAD_TAG: ${{ env.BAD_TAG }}
          BAD_SHA: ${{ env.BAD_SHA }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            // Delete sim-bad-v1.1 and recreate it so created_at is most recent
            const badRel = releases.find(r => r.tag_name === process.env.BAD_TAG);
            if (badRel) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner, repo: context.repo.repo, release_id: badRel.id,
              });
            }
            await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: process.env.BAD_TAG,
              target_commitish: process.env.BAD_SHA,
              name: 'Cloud Settings 1.1 (bad — to be rolled back)',
              body: 'Bad release. Contains PRs: #1 dark mode, #2 new settings, #4 dark mode.\nThis version was rolled back.',
              draft: false, prerelease: false, make_latest: 'true',
            });
            core.info(`Recreated ${process.env.BAD_TAG} as most-recently-created release`);
            for (let i = 0; i < 5; i++) {
              const { data: latest } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner, repo: context.repo.repo,
              });
              if (latest.tag_name === process.env.BAD_TAG) {
                core.info(`✓ getLatestRelease() = ${latest.tag_name}`);
                return;
              }
              await new Promise(r => setTimeout(r, 2000));
            }
            core.setFailed('getLatestRelease() did not return sim-bad-v1.1 after cleanup');

      # ── Scenario B — Post-rollback, NO from (buggy) ───────────────────────
      # getLatestRelease() = sim-bad-v1.1. No from input.
      # Expected: changelog = PRs after bad tag only = #5 #6 #7.
      # PROBLEM: misses #1 #2 #4 (changes that were in the bad version!).
      - name: "Scenario B — publish sim-redeploy-b, no from (post-rollback, buggy)"
        id: publish-b
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ github.sha }}
          version: "2.0.1"
          tag: "sim-redeploy-b"
          name: "Redeploy B — post-rollback, no from (INCOMPLETE)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario B — record result"
        id: assert-b
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag: 'sim-redeploy-b',
            });
            const body = rel.body || '';
            core.info(`B body:\n${body}`);
            for (const n of [1,2,4,5,6,7]) core.setOutput(`has_${n}`, String(body.includes(`#${n}`)));

      # ── Scenario C — Post-rollback, WITH from: sim-stable-v1.0 (correct) ──
      # getLatestRelease() = sim-redeploy-b (most recently created).
      # But from: sim-stable-v1.0 overrides it.
      # Expected: changelog = all PRs since stable = #1 #2 #4 #5 #6 #7. COMPLETE.
      - name: "Scenario C — publish sim-redeploy-c, from: sim-stable-v1.0 (post-rollback, correct)"
        id: publish-c
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: sim-stable-v1.0
          version: "2.0.1"
          tag: "sim-redeploy-c"
          name: "Redeploy C — post-rollback, from: sim-stable-v1.0 (COMPLETE)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Final assert — compare B vs C ────────────────────────────────────
      - name: "Final — assert B vs C: from makes the difference"
        uses: actions/github-script@v7
        env:
          B_HAS_1: ${{ steps.assert-b.outputs.has_1 }}
          B_HAS_2: ${{ steps.assert-b.outputs.has_2 }}
          B_HAS_4: ${{ steps.assert-b.outputs.has_4 }}
          B_HAS_5: ${{ steps.assert-b.outputs.has_5 }}
          B_HAS_6: ${{ steps.assert-b.outputs.has_6 }}
          B_HAS_7: ${{ steps.assert-b.outputs.has_7 }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: relC } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag: 'sim-redeploy-c',
            });
            const bodyC = relC.body || '';
            core.info(`C body:\n${bodyC}`);
            const b = { 1: process.env.B_HAS_1==='true', 2: process.env.B_HAS_2==='true', 4: process.env.B_HAS_4==='true', 5: process.env.B_HAS_5==='true', 6: process.env.B_HAS_6==='true', 7: process.env.B_HAS_7==='true' };
            const c = { 1: bodyC.includes('#1'), 2: bodyC.includes('#2'), 4: bodyC.includes('#4'), 5: bodyC.includes('#5'), 6: bodyC.includes('#6'), 7: bodyC.includes('#7') };
            const bComplete = Object.values(b).every(Boolean);
            const cComplete = Object.values(c).every(Boolean);
            const t = (v) => v ? '✅' : '❌';
            await core.summary
              .addHeading('Rollback Simulation — Final Results')
              .addRaw('**Stable:** `sim-stable-v1.0` | **Bad (rolled back):** `sim-bad-v1.1` | **Fix/Redeploy:** HEAD\n\n')
              .addRaw('| Release | PRs it introduced |\n|---|---|\n| `sim-stable-v1.0` | *(baseline)* |\n| `sim-bad-v1.1` | #1 feat, #2 feat, #4 feat |\n| fix/redeploy | #5 feat, #6 fix, #7 fix |\n\n')
              .addHeading('A — Normal deploy, from: ""', 3)
              .addRaw('✅ Release created. Empty `from` is safe — does not crash.\n\n')
              .addHeading('B vs C — Post-rollback deploy', 3)
              .addTable([
                [{data:'Scenario',header:true},{data:'from input',header:true},{data:'#1 (bad PR)',header:true},{data:'#2 (bad PR)',header:true},{data:'#4 (bad PR)',header:true},{data:'#5 (fix PR)',header:true},{data:'#6 (fix PR)',header:true},{data:'#7 (fix PR)',header:true},{data:'Complete?',header:true}],
                ['B — no from', 'none (defaults to getLatestRelease)', t(b[1]), t(b[2]), t(b[4]), t(b[5]), t(b[6]), t(b[7]), bComplete ? '✅ yes' : '❌ missing bad-version PRs'],
                ['C — with from', 'sim-stable-v1.0', t(c[1]), t(c[2]), t(c[4]), t(c[5]), t(c[6]), t(c[7]), cComplete ? '✅ yes' : '❌ incomplete'],
              ])
              .addRaw((!bComplete && cComplete)
                ? '\n✅ **`from` works:** B misses the bad version\'s PRs (#1 #2 #4); C includes all changes since stable.\n'
                : '\n⚠️ Unexpected result — check scenario setup.\n')
              .addLink('View B release (incomplete)', `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/sim-redeploy-b`)
              .addLink('View C release (complete)', `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/sim-redeploy-c`)
              .write();
            if (!cComplete) core.setFailed(`FAIL: C missing PRs — from: sim-stable-v1.0 must include #1 #2 #4 #5 #6 #7. Got: ${JSON.stringify(c)}`);
            else core.info('✅ PASS: from: sim-stable-v1.0 produces complete post-rollback changelog');
