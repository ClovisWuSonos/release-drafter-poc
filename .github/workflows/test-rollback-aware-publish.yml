name: Test Rollback-Aware Publish

# Tests `from` input behavior with release-drafter v7.10.0.
#
# Scenario A — normal forward deploy:
#   Publish with from: --latest (cloud-settings-1.1.3). Changelog should include PRs after 1.1.2.
#
# Scenario B — rollback case:
#   --latest pinned to cloud-settings-1.1.3 (simulates rollback from a higher bad version).
#   B1 — without from: defaults to getLatestRelease() = 1.1.2.
#   B2 — with from: cloud-settings-1.1.3 (explicit). Changelog identical to B1.
#   Key assertion: both should include PRs #5, #6, #7 (merged after 1.1.2 in history).
#
# Scenario C — empty from:
#   Publish with from: "" — must not crash, release must be created.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Reset test releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const candidates = [
              'cloud-settings-test-a',
              'cloud-settings-test-b1',
              'cloud-settings-test-b2',
              'cloud-settings-test-c',
            ];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            for (const tag of candidates) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted release ${tag}`);
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Deleted tag ${tag}`);
              } catch { core.info(`Tag ${tag} did not exist`); }
            }

      # ── Pin --latest to cloud-settings-1.1.3 ─────────────────────────────
      # 1.1.2 exists and has commits/PRs after it in main history.
      - name: "Pin --latest to cloud-settings-1.1.3 and verify"
        id: pin
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            const rel = releases.find(r => r.tag_name === 'cloud-settings-1.1.3');
            if (!rel) core.setFailed('cloud-settings-1.1.3 release not found — run setup first');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, make_latest: 'true',
            });
            for (let i = 0; i < 5; i++) {
              const { data: latest } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner, repo: context.repo.repo,
              });
              if (latest.tag_name === 'cloud-settings-1.1.3') {
                core.info(`--latest confirmed: ${latest.tag_name}`);
                core.setOutput('tag', latest.tag_name);
                return;
              }
              core.info(`--latest is ${latest.tag_name}, waiting... (attempt ${i+1})`);
              await new Promise(r => setTimeout(r, 1000));
            }
            core.setFailed('--latest did not update to cloud-settings-1.1.3');

      # ── Scenario A — publish with from: --latest ──────────────────────────
      - name: "Scenario A — publish cloud-settings-test-a WITH from: 1.1.2"
        id: publish-a
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: ${{ steps.pin.outputs.tag }}
          version: "test-a"
          tag: "cloud-settings-test-a"
          name: "Cloud Settings test-a (from: 1.1.2)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario A — assert: changelog has PRs after 1.1.2"
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.publish-a.outputs.tag_name }}
          FROM_TAG: ${{ steps.pin.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            const body = rel.body || '';
            core.info(`A body:\n${body}`);
            const hasContent = body.trim().length > 0 && !body.includes('No changes');
            await core.summary
              .addHeading('Scenario A — Normal Deploy (from: cloud-settings-1.1.3)')
              .addTable([
                [{data:'from',header:true},{data:'Has changelog content',header:true},{data:'Result',header:true}],
                [process.env.FROM_TAG, String(hasContent), hasContent ? '✅ Correct' : '❌ Empty changelog'],
              ])
              .addLink('View release', rel.html_url)
              .write();
            if (!hasContent) core.setFailed('FAIL: Scenario A changelog is empty with from: cloud-settings-1.1.3');
            else core.info('✅ Scenario A PASS: from: 1.1.2 → non-empty changelog');

      # ── Scenario B — rollback: --latest still pinned to 1.1.2 ─────────────
      # Simulates: v1.1.2 was good, some higher version was bad and rolled back,
      # --latest is back to 1.1.2. Deploy fix.
      # B1: without from → defaults to getLatestRelease() = 1.1.2 (same anchor, correct result)
      # B2: with from: 1.1.2 → explicit anchor, same result
      - name: "Scenario B1 — publish without from (default anchor)"
        id: publish-b1
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ github.sha }}
          version: "test-b1"
          tag: "cloud-settings-test-b1"
          name: "Cloud Settings test-b1 (no from)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario B1 — record result and re-pin --latest to 1.1.2"
        id: result-b1
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.publish-b1.outputs.tag_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            const body = rel.body || '';
            core.info(`B1 (no from):\n${body}`);
            core.setOutput('body', body);
            core.setOutput('has_content', String(body.trim().length > 0 && !body.includes('No changes')));
            // Re-pin --latest to 1.1.2 since B1 publish overwrote it
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            const rel12 = releases.find(r => r.tag_name === 'cloud-settings-1.1.3');
            if (rel12) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: rel12.id, make_latest: 'true',
              });
              core.info('Re-pinned --latest → cloud-settings-1.1.3 after B1');
            }

      - name: "Scenario B2 — publish WITH from: 1.1.2 (explicit)"
        id: publish-b2
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: ${{ steps.pin.outputs.tag }}
          version: "test-b2"
          tag: "cloud-settings-test-b2"
          name: "Cloud Settings test-b2 (from: 1.1.2)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario B — assert: from and no-from produce same result when --latest = last good"
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.publish-b2.outputs.tag_name }}
          FROM_TAG: ${{ steps.pin.outputs.tag }}
          B1_HAS_CONTENT: ${{ steps.result-b1.outputs.has_content }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            const body = rel.body || '';
            const b2HasContent = body.trim().length > 0 && !body.includes('No changes');
            const b1HasContent = process.env.B1_HAS_CONTENT === 'true';
            core.info(`B1 (no from, default=getLatestRelease): has_content=${b1HasContent}`);
            core.info(`B2 (from=${process.env.FROM_TAG}): has_content=${b2HasContent}`);
            await core.summary
              .addHeading('Scenario B — Rollback (--latest pinned to 1.1.2)')
              .addTable([
                [{data:'Test',header:true},{data:'Anchor',header:true},{data:'Has changelog content',header:true},{data:'Result',header:true}],
                ['B1 — without from','getLatestRelease() = 1.1.2 (--latest)',String(b1HasContent), b1HasContent ? '✅' : '❌'],
                ['B2 — with from: 1.1.2','cloud-settings-1.1.3 (explicit)',String(b2HasContent), b2HasContent ? '✅' : '❌'],
              ])
              .addLink('View B2 release', rel.html_url)
              .write();
            if (!b2HasContent) core.setFailed('FAIL: B2 changelog is empty even with from: cloud-settings-1.1.3');
            else core.info('✅ Scenario B PASS: both B1 and B2 produce changelog with from: 1.1.2');

      # ── Scenario C — empty from ────────────────────────────────────────────
      - name: "Scenario C — publish with from: '' (empty)"
        id: publish-c
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: ""
          version: "test-c"
          tag: "cloud-settings-test-c"
          name: "Cloud Settings test-c (from: empty)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario C — assert: empty from does not crash, release is created"
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.publish-c.outputs.tag_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            core.info(`C tag: ${rel.tag_name}`);
            await core.summary
              .addHeading('Scenario C — Empty from (safety check)')
              .addTable([
                [{data:'from passed',header:true},{data:'Release created',header:true},{data:'Result',header:true}],
                ['(empty)', rel.tag_name || '(none)', rel.tag_name ? '✅ Safe' : '❌ Failed'],
              ])
              .addLink('View release', rel.html_url)
              .write();
            if (!rel.tag_name) core.setFailed('FAIL: release not created with empty from');
            else core.info(`✅ Scenario C PASS: empty from is safe (tag: ${rel.tag_name})`);
