name: Test Rollback-Aware Publish

# Simulates three real-world deploy scenarios to validate the `from` input in
# release-drafter v7.10.0 (SHA 978bb0b30c5ee8cdd332ced253758157150d43f0).
#
# Repo history setup (tags created ahead of time):
#
#   sim-stable-v1.0  ← last known-good version (baseline)
#     PR #1  feat: add dark mode support
#     PR #2  feat: add new settings panel
#     PR #4  feat: Dark mode support
#   sim-bad-v1.1     ← bad version, released then rolled back
#     PR #5  feat: New settings panel
#     PR #6  fix:  Stabilise config reload
#     PR #7  fix:  Critical hotfix after rollback
#   HEAD             ← fix/redeploy
#
# Scenarios:
#
#   A — Normal forward deploy (no rollback):
#       --latest = sim-bad-v1.1. from = "" (empty). Changelog since bad = #5 #6 #7.
#       Validates: empty from is safe and anchors to --latest normally.
#
#   B — Post-rollback, WITHOUT from:
#       --latest still = sim-bad-v1.1 (rollback does NOT move --latest).
#       No from input. Changelog since bad = #5 #6 #7 only. INCOMPLETE.
#       Demonstrates the bug.
#
#   C — Post-rollback, WITH from: sim-stable-v1.0:
#       --latest still = sim-bad-v1.1. from = sim-stable-v1.0.
#       Changelog since stable = #1 #2 #4 #5 #6 #7. COMPLETE.
#       Demonstrates the fix.
#
#   Assert: C has more entries than B (the `from` input makes a real difference).

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

env:
  STABLE_TAG: sim-stable-v1.0
  BAD_TAG: sim-bad-v1.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Reset test releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const candidates = ['sim-redeploy-a', 'sim-redeploy-b', 'sim-redeploy-c'];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            for (const tag of candidates) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted release ${tag}`);
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Deleted tag ${tag}`);
              } catch { core.info(`Tag ${tag} did not exist`); }
            }

      - name: "Setup — pin --latest to sim-bad-v1.1 (bad version, not yet rolled back)"
        uses: actions/github-script@v7
        env:
          BAD_TAG: ${{ env.BAD_TAG }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            const rel = releases.find(r => r.tag_name === process.env.BAD_TAG);
            if (!rel) core.setFailed(`Release ${process.env.BAD_TAG} not found`);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, make_latest: 'true',
            });
            for (let i = 0; i < 5; i++) {
              const { data: latest } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner, repo: context.repo.repo,
              });
              if (latest.tag_name === process.env.BAD_TAG) {
                core.info(`✓ --latest = ${latest.tag_name}`);
                return;
              }
              await new Promise(r => setTimeout(r, 1000));
            }
            core.setFailed(`--latest did not update to ${process.env.BAD_TAG}`);

      # ── Scenario A — Normal forward deploy, empty from ────────────────────
      # --latest = sim-bad-v1.1. from = "" (normal deploy, no rollback).
      # Expected: changelog = PRs after bad tag = #5 #6 #7.
      - name: "Scenario A — publish sim-redeploy-a with from: '' (normal deploy)"
        id: publish-a
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: ""
          version: "2.0.0"
          tag: "sim-redeploy-a"
          name: "Redeploy A — normal deploy (from: empty)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario A — assert: empty from is safe, changelog = PRs since --latest"
        id: assert-a
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag: 'sim-redeploy-a',
            });
            const body = rel.body || '';
            const created = !!rel.tag_name;
            const hasFive  = body.includes('#5');
            const hasSix   = body.includes('#6');
            const hasSeven = body.includes('#7');
            const hasOne   = body.includes('#1');
            const hasTwo   = body.includes('#2');
            const hasFour  = body.includes('#4');
            core.info(`A body:\n${body}`);
            core.setOutput('body', body);
            await core.summary
              .addHeading('Scenario A — Normal Deploy (from: "")')
              .addRaw('> --latest = sim-bad-v1.1 | from = "" | Expected: PRs after bad tag only (#5 #6 #7)\n\n')
              .addTable([
                [{data:'Release created',header:true},{data:'#1 #2 #4 (bad version PRs)',header:true},{data:'#5 #6 #7 (fix PRs)',header:true},{data:'Result',header:true}],
                [
                  created ? '✅ yes' : '❌ no',
                  [hasOne,hasTwo,hasFour].some(Boolean) ? `⚠️ yes (#${[hasOne?1:null,hasTwo?2:null,hasFour?4:null].filter(Boolean).join(' #')})` : '✅ no',
                  [hasFive,hasSix,hasSeven].every(Boolean) ? '✅ yes' : `❌ missing ${[hasFive?null:'#5',hasSix?null:'#6',hasSeven?null:'#7'].filter(Boolean).join(' ')}`,
                  created && [hasFive,hasSix,hasSeven].every(Boolean) ? '✅ PASS' : '❌ FAIL',
                ],
              ])
              .write();
            if (!created) core.setFailed('FAIL A: release not created');
            else if (![hasFive,hasSix,hasSeven].every(Boolean)) core.setFailed('FAIL A: missing fix PRs');
            else core.info('✅ Scenario A PASS: empty from is safe, changelog = PRs since --latest');

      # ── Re-pin --latest to sim-bad-v1.1 (A publish moved it) ──────────────
      - name: "Re-pin --latest to sim-bad-v1.1 after Scenario A"
        uses: actions/github-script@v7
        env:
          BAD_TAG: ${{ env.BAD_TAG }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            const rel = releases.find(r => r.tag_name === process.env.BAD_TAG);
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, make_latest: 'true',
            });
            core.info(`Re-pinned --latest → ${process.env.BAD_TAG}`);

      # ── Scenario B — Post-rollback, WITHOUT from (demonstrates the bug) ───
      # --latest still = sim-bad-v1.1 (rollback does NOT move --latest).
      # No from. Expected: changelog = PRs after bad tag only = #5 #6 #7. INCOMPLETE.
      - name: "Scenario B — publish sim-redeploy-b WITHOUT from (post-rollback, buggy)"
        id: publish-b
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ github.sha }}
          version: "2.0.1"
          tag: "sim-redeploy-b"
          name: "Redeploy B — post-rollback WITHOUT from (incomplete)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario B — record result (incomplete changelog)"
        id: assert-b
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag: 'sim-redeploy-b',
            });
            const body = rel.body || '';
            core.info(`B body:\n${body}`);
            core.setOutput('body', body);
            core.setOutput('has_one',   String(body.includes('#1')));
            core.setOutput('has_two',   String(body.includes('#2')));
            core.setOutput('has_four',  String(body.includes('#4')));
            core.setOutput('has_five',  String(body.includes('#5')));
            core.setOutput('has_six',   String(body.includes('#6')));
            core.setOutput('has_seven', String(body.includes('#7')));
            // Re-pin --latest back to bad tag (B publish moved it to B)
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            const badRel = releases.find(r => r.tag_name === 'sim-bad-v1.1');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: badRel.id, make_latest: 'true',
            });
            core.info('Re-pinned --latest → sim-bad-v1.1 after B');

      # ── Scenario C — Post-rollback, WITH from: sim-stable-v1.0 (the fix) ──
      # --latest still = sim-bad-v1.1. from = sim-stable-v1.0.
      # Expected: changelog = all PRs since stable = #1 #2 #4 #5 #6 #7. COMPLETE.
      - name: "Scenario C — publish sim-redeploy-c WITH from: sim-stable-v1.0 (post-rollback, correct)"
        id: publish-c
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: ${{ env.STABLE_TAG }}
          version: "2.0.1"
          tag: "sim-redeploy-c"
          name: "Redeploy C — post-rollback WITH from: sim-stable-v1.0 (complete)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Final assert: compare B vs C ──────────────────────────────────────
      - name: "Final — assert C has complete changelog; B vs C shows from makes a difference"
        uses: actions/github-script@v7
        env:
          B_HAS_ONE:   ${{ steps.assert-b.outputs.has_one }}
          B_HAS_TWO:   ${{ steps.assert-b.outputs.has_two }}
          B_HAS_FOUR:  ${{ steps.assert-b.outputs.has_four }}
          B_HAS_FIVE:  ${{ steps.assert-b.outputs.has_five }}
          B_HAS_SIX:   ${{ steps.assert-b.outputs.has_six }}
          B_HAS_SEVEN: ${{ steps.assert-b.outputs.has_seven }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: relC } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag: 'sim-redeploy-c',
            });
            const bodyC = relC.body || '';
            core.info(`C body:\n${bodyC}`);
            const b = {
              one: process.env.B_HAS_ONE === 'true', two: process.env.B_HAS_TWO === 'true',
              four: process.env.B_HAS_FOUR === 'true', five: process.env.B_HAS_FIVE === 'true',
              six: process.env.B_HAS_SIX === 'true', seven: process.env.B_HAS_SEVEN === 'true',
            };
            const c = {
              one: bodyC.includes('#1'), two: bodyC.includes('#2'),
              four: bodyC.includes('#4'), five: bodyC.includes('#5'),
              six: bodyC.includes('#6'), seven: bodyC.includes('#7'),
            };
            const bComplete = Object.values(b).every(Boolean);
            const cComplete = Object.values(c).every(Boolean);
            const fromHelps = !bComplete && cComplete;
            await core.summary
              .addHeading('Rollback Simulation — Results')
              .addRaw('**Repo state:** stable=`sim-stable-v1.0` | bad=`sim-bad-v1.1` (--latest) | fix=HEAD\n\n')
              .addRaw('**PRs per release:** stable has nothing new | bad added #1 #2 #4 | fix adds #5 #6 #7\n\n')
              .addHeading('Scenario A — Normal deploy, from: ""', 3)
              .addRaw('> Release created successfully — empty `from` is safe.\n\n')
              .addHeading('Scenario B vs C — Post-rollback deploy', 3)
              .addTable([
                [{data:'',header:true},{data:'#1 (bad PR)',header:true},{data:'#2 (bad PR)',header:true},{data:'#4 (bad PR)',header:true},{data:'#5 (fix PR)',header:true},{data:'#6 (fix PR)',header:true},{data:'#7 (fix PR)',header:true},{data:'Complete?',header:true}],
                ['B — no from (buggy)',   b.one?'✅':'❌', b.two?'✅':'❌', b.four?'✅':'❌', b.five?'✅':'❌', b.six?'✅':'❌', b.seven?'✅':'❌', bComplete?'✅ yes':'❌ missing bad PRs'],
                ['C — from: sim-stable', c.one?'✅':'❌', c.two?'✅':'❌', c.four?'✅':'❌', c.five?'✅':'❌', c.six?'✅':'❌', c.seven?'✅':'❌', cComplete?'✅ yes':'❌ incomplete'],
              ])
              .addRaw(fromHelps
                ? '\n✅ **`from` input works:** B misses the bad version PRs; C includes them all.\n'
                : '\n⚠️ B and C produced the same result — check --latest pin.\n')
              .addLink('View B release', `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/sim-redeploy-b`)
              .addLink('View C release', `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/sim-redeploy-c`)
              .write();
            if (!cComplete) core.setFailed(`FAIL: C missing PRs — from: sim-stable-v1.0 should include #1 #2 #4 #5 #6 #7`);
            else if (!fromHelps) core.warning('B and C matched — from had no effect (check --latest state)');
            else core.info('✅ PASS: from: sim-stable-v1.0 produces complete post-rollback changelog');
