name: Test Rollback-Aware Publish

# Tests that `from` produces correct changelog anchoring in both cases.
#
# Scenario A — normal forward deploy:
#   --latest = cloud-settings-1.1.12 = highest semver published.
#   Test A1 (without from): Release Drafter defaults to highest semver → PR #7 only.
#   Test A2 (with from: cloud-settings-1.1.12): same result → PR #7 only.
#   ✓ `from` is a no-op in the normal case; behaviour is identical.
#
# Scenario B — rollback:
#   --latest rolled back to cloud-settings-1.1.10.
#   cloud-settings-1.2.0 is the highest semver published (still present, just not --latest).
#   Test B1 (without from): defaults to 1.2.0 (highest semver) → "No changes" ← WRONG.
#   Test B2 (with from: cloud-settings-1.1.10): anchors to --latest → PRs #5 #6 #7 ← CORRECT.
#   ✓ `from` is required after a rollback; without it the changelog silently drops changes.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Reset test releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const candidates = [
              'cloud-settings-1.2.0',
              'cloud-settings-1.2.1',
              'cloud-settings-1.2.1-no-from',
            ];
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            for (const tag of candidates) {
              const rel = releases.find(r => r.tag_name === tag);
              if (rel) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
                });
                core.info(`Deleted release ${tag}`);
              }
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo, ref: `tags/${tag}`,
                });
                core.info(`Deleted tag ${tag}`);
              } catch { core.info(`Tag ${tag} did not exist`); }
            }

      # ── Scenario A — normal forward deploy ────────────────────────────────
      - name: "Scenario A — pin --latest to cloud-settings-1.1.12"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            const rel = releases.find(r => r.tag_name === 'cloud-settings-1.1.12');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, make_latest: 'true',
            });
            core.info('Pinned --latest → cloud-settings-1.1.12');

      # A1: publish WITHOUT from — Release Drafter defaults to highest semver (1.1.12)
      - name: "Scenario A1 — publish 1.2.0 WITHOUT from"
        id: publish-a1
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: true
          commitish: ${{ github.sha }}
          version: "1.2.0"
          tag: "cloud-settings-1.2.0"
          name: "Cloud Settings 1.2.0"
          footer: |
            ---
            ## 🚀 Rollout Status
            | Region | Status |
            |---|---|
            | us-east-1 | ✅ Success |
            | eu-west-1 | ✅ Success |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario A1 — verify (no from)"
        id: verify-a1
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.publish-a1.outputs.tag_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            const body = rel.body || '';
            core.info(`A1 body:\n${body}`);
            const hasSeven = body.includes('#7');
            const hasEarlier = body.includes('#5') || body.includes('#6');
            core.setOutput('result', JSON.stringify({ hasSeven, hasEarlier, body }));
            core.info(`A1 — PR #7 present: ${hasSeven}, PRs #5/#6 present: ${hasEarlier}`);

      # Delete 1.2.0 and recreate it WITH from for A2
      - name: "Scenario A2 — reset cloud-settings-1.2.0"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            const rel = releases.find(r => r.tag_name === 'cloud-settings-1.2.0');
            if (rel) await github.rest.repos.deleteRelease({
              owner: context.repo.owner, repo: context.repo.repo, release_id: rel.id,
            });
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: 'tags/cloud-settings-1.2.0',
              });
            } catch {}

      - name: "Scenario A2 — get --latest tag"
        id: latest-a
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner, repo: context.repo.repo,
            });
            core.info(`--latest: ${data.tag_name}`);
            core.setOutput('tag', data.tag_name);

      # A2: publish WITH from — should produce identical result to A1
      - name: "Scenario A2 — publish 1.2.0 WITH from"
        id: publish-a2
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: ${{ steps.latest-a.outputs.tag }}
          version: "1.2.0"
          tag: "cloud-settings-1.2.0"
          name: "Cloud Settings 1.2.0"
          footer: |
            ---
            ## 🚀 Rollout Status
            | Region | Status |
            |---|---|
            | us-east-1 | ✅ Success |
            | eu-west-1 | ✅ Success |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario A — assert: from is a no-op in the normal case"
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.publish-a2.outputs.tag_name }}
          A1_RESULT: ${{ steps.verify-a1.outputs.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const a1 = JSON.parse(process.env.A1_RESULT);
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            const a2body = rel.body || '';
            const a2HasSeven = a2body.includes('#7');
            const a2HasEarlier = a2body.includes('#5') || a2body.includes('#6');

            core.info(`A1 (no from): PR #7=${a1.hasSeven}, PRs #5/#6=${a1.hasEarlier}`);
            core.info(`A2 (from=1.1.12): PR #7=${a2HasSeven}, PRs #5/#6=${a2HasEarlier}`);

            await core.summary
              .addHeading('Scenario A — Normal Forward Deploy')
              .addTable([
                [{data: 'Test', header: true}, {data: 'PR #7', header: true}, {data: 'PRs #5/#6', header: true}, {data: 'Result', header: true}],
                ['A1 — without from', String(a1.hasSeven), String(a1.hasEarlier), a1.hasSeven && !a1.hasEarlier ? '✅ Correct' : '❌ Wrong'],
                ['A2 — with from: 1.1.12', String(a2HasSeven), String(a2HasEarlier), a2HasSeven && !a2HasEarlier ? '✅ Correct' : '❌ Wrong'],
              ])
              .addRaw('Both A1 and A2 should show PR #7 only — `from` is a no-op when `--latest` equals highest semver.')
              .write();

            if (!a1.hasSeven || !a2HasSeven)
              core.setFailed('FAIL: PR #7 missing in Scenario A');
            else if (a1.hasEarlier || a2HasEarlier)
              core.setFailed('FAIL: PRs #5/#6 should not appear in Scenario A');
            else
              core.info('✅ Scenario A PASS: identical result with and without from (PR #7 only)');

      # ── Scenario B — rollback ──────────────────────────────────────────────
      - name: "Scenario B — pin --latest back to cloud-settings-1.1.10"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 50,
            });
            const rel = releases.find(r => r.tag_name === 'cloud-settings-1.1.10');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id, make_latest: 'true',
            });
            core.info('Pinned --latest → cloud-settings-1.1.10');
            core.info('cloud-settings-1.2.0 remains published (highest semver) but is NOT --latest');

      # B1: publish 1.2.1 WITHOUT from — defaults to highest semver = 1.2.0 → wrong changelog
      - name: "Scenario B1 — publish 1.2.1 WITHOUT from (demonstrates the problem)"
        id: publish-b1
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: true
          commitish: ${{ github.sha }}
          version: "1.2.1"
          tag: "cloud-settings-1.2.1-no-from"
          name: "Cloud Settings 1.2.1 (no-from control)"
          footer: |
            ---
            ## 🚀 Rollout Status
            | Region | Status |
            |---|---|
            | us-east-1 | ✅ Success |
            | eu-west-1 | ✅ Success |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario B1 — verify (no from, expect wrong result)"
        id: verify-b1
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.publish-b1.outputs.tag_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            const body = rel.body || '';
            core.info(`B1 body (no from — expect missing PRs):\n${body}`);
            const missing = ['#5', '#6', '#7'].filter(n => !body.includes(n));
            core.setOutput('result', JSON.stringify({
              hasFive: body.includes('#5'),
              hasSix: body.includes('#6'),
              hasSeven: body.includes('#7'),
              missing,
              body,
            }));
            core.info(`B1 — missing PRs: ${missing.join(', ') || 'none'}`);

      # B2: publish 1.2.1 WITH from: cloud-settings-1.1.10 → correct changelog
      - name: "Scenario B2 — get --latest tag"
        id: latest-b
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner, repo: context.repo.repo,
            });
            core.info(`--latest: ${data.tag_name}`);
            core.setOutput('tag', data.tag_name);

      - name: "Scenario B2 — publish 1.2.1 WITH from (the fix)"
        id: publish-b2
        uses: release-drafter/release-drafter@f259c0ada5376557cd49e74487398301fab5287a
        with:
          publish: true
          commitish: ${{ github.sha }}
          from: ${{ steps.latest-b.outputs.tag }}
          version: "1.2.1"
          tag: "cloud-settings-1.2.1"
          name: "Cloud Settings 1.2.1"
          footer: |
            ---
            ## 🚀 Rollout Status
            | Region | Status |
            |---|---|
            | us-east-1 | ✅ Success |
            | eu-west-1 | ✅ Success |

            _Post-rollback fix release. cloud-settings-1.2.0 was rolled back to cloud-settings-1.1.10. This release re-ships all changes since 1.1.10._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Scenario B — mark cloud-settings-1.2.0 as rolled back"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: 'cloud-settings-1.2.0',
            });
            const existingBody = rel.body || '';
            const separatorIdx = existingBody.indexOf('\n---\n');
            const changelogPart = separatorIdx !== -1 ? existingBody.slice(0, separatorIdx) : existingBody;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: rel.id,
              body: `${changelogPart}\n---\n## 🔴 Rollout Status — This Release Was Rolled Back\n| Region | Status |\n|---|---|\n| us-east-1 | ⏪ Rolled Back |\n| eu-west-1 | ⏪ Rolled Back |\n\n_This release was rolled back in production. Superseded by cloud-settings-1.2.1, which re-ships these changes plus the hotfix._`,
            });
            core.info('Marked cloud-settings-1.2.0 as rolled back');

      - name: "Scenario B — assert: from fixes rollback changelog"
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.publish-b2.outputs.tag_name }}
          B1_RESULT: ${{ steps.verify-b1.outputs.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const b1 = JSON.parse(process.env.B1_RESULT);
            const { data: rel } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            const b2body = rel.body || '';
            const b2Has = (n) => b2body.includes(n);

            core.info(`B1 (no from): #5=${b1.hasFive} #6=${b1.hasSix} #7=${b1.hasSeven}`);
            core.info(`B2 (from=1.1.10): #5=${b2Has('#5')} #6=${b2Has('#6')} #7=${b2Has('#7')}`);

            await core.summary
              .addHeading('Scenario B — Rollback')
              .addTable([
                [{data: 'Test', header: true}, {data: 'Anchor', header: true}, {data: 'PR #5', header: true}, {data: 'PR #6', header: true}, {data: 'PR #7', header: true}, {data: 'Result', header: true}],
                ['B1 — without from', '1.2.0 (highest semver)', String(b1.hasFive), String(b1.hasSix), String(b1.hasSeven), b1.missing.length > 0 ? `❌ Missing: ${b1.missing.join(' ')}` : '(unexpected pass)'],
                ['B2 — with from: 1.1.10', '1.1.10 (--latest)', String(b2Has('#5')), String(b2Has('#6')), String(b2Has('#7')), ['#5','#6','#7'].every(n => b2Has(n)) ? '✅ Correct' : '❌ Wrong'],
              ])
              .addRaw('Without `from`, Release Drafter anchors to the highest semver published release (1.2.0) and the changelog is empty — the re-shipped changes are invisible. With `from: --latest (1.1.10)`, all changes since the rollback target are included.')
              .write();

            // B1 must be missing PRs (proves the problem exists)
            if (b1.missing.length === 0)
              core.warning('B1 unexpectedly passed — re-shipped PRs appeared even without from');
            else
              core.info(`✅ B1 confirmed broken without from: missing ${b1.missing.join(', ')}`);

            // B2 must have all PRs (proves from fixes it)
            const b2Missing = ['#5','#6','#7'].filter(n => !b2Has(n));
            if (b2Missing.length > 0)
              core.setFailed(`FAIL: Scenario B2 missing PRs ${b2Missing.join(', ')} even with from`);
            else
              core.info('✅ Scenario B PASS: from fixes rollback anchoring — PRs #5 #6 #7 all present');
