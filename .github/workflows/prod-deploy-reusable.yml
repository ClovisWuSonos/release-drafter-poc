name: prod-deploy-reusable
on:
  workflow_call:
    inputs:
      service: { type: string, required: true }
# same shape as the real change: identical group string in both reusable workflows
concurrency:
  group: argo-prod-deploy-${{ github.repository }}-${{ inputs.service }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "DEPLOY START $(date -u +%T)"; sleep 30; echo "DEPLOY END $(date -u +%T)"
