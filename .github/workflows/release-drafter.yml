name: Release Drafter

# Runs on every push to main. Job 1 creates the real version tag (stand-in
# for constraint #1's external auto-versioning pipeline). Job 2 then updates
# the running draft, but does NOT let release-drafter guess its own version —
# it's handed the exact version Job 1 just tagged, so the draft's name and
# tag are always mechanically identical to the real tag, never independently
# computed guesses that happen to agree.
on:
  push:
    branches:
      - main
  workflow_dispatch: {} # handy for manually forcing a draft refresh during testing

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch version and create+push tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force

          LATEST=$(git tag --list 'cloud-settings-*' \
            | sed 's/cloud-settings-//' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n1)

          if [ -z "$LATEST" ]; then
            NEW_VERSION="1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          NEW_TAG="cloud-settings-${NEW_VERSION}"
          COMMIT_SHA="${{ github.sha }}"

          echo "Latest tag found: ${LATEST:-<none>}"
          echo "Creating tag ${NEW_TAG} at commit ${COMMIT_SHA}"

          git tag "$NEW_TAG" "$COMMIT_SHA"
          git push origin "$NEW_TAG"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### 🏷️ Tagged \`${NEW_TAG}\`"
            echo "Commit: \`${COMMIT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  update_release_draft:
    needs: auto-tag
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          publish: false
          version: ${{ needs.auto-tag.outputs.version }}
          tag: cloud-settings-${{ needs.auto-tag.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
