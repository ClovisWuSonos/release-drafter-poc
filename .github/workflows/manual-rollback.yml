name: Manual Rollback

# Rolls back to a previously deployed version by:
# 1. Updating the current --latest release's rollout status to "Rolled Back"
# 2. Re-pointing --latest to the target rollback version

on:
  workflow_dispatch:
    inputs:
      rollback-to-version:
        description: 'Version to roll back to (e.g. 1.1.0) — must be an existing published release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Update current latest release to Rolled Back status
        uses: actions/github-script@v7
        env:
          ROLLBACK_TO: ${{ inputs.rollback-to-version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rollbackTo = `cloud-settings-${process.env.ROLLBACK_TO}`;

            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const status = `## 🚀 Rollout Status\nus-east-1: ⏪ Rolled Back → ${rollbackTo}\neu-west-1: ⏪ Rolled Back → ${rollbackTo}`;
            const body = release.body.replace(/## 🚀 Rollout Status[\s\S]*/, status);

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body,
            });
            core.info(`${release.tag_name} marked as Rolled Back → ${rollbackTo}`);

      - name: Re-point --latest to rollback target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "cloud-settings-${{ inputs.rollback-to-version }}" \
            --repo ${{ github.repository }} \
            --latest
          echo "cloud-settings-${{ inputs.rollback-to-version }} marked as --latest"
