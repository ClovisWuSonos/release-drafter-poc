name: Manual Rollback

# Rolls back to a previously deployed version by:
# 1. Updating the current --latest release's rollout status to "Rolled Back"
# 2. Re-pointing --latest to the target rollback version

on:
  workflow_dispatch:
    inputs:
      rollback-to-version:
        description: 'Version to roll back to (e.g. 1.1.0) — must be an existing published release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Update current latest release to Rolled Back status
        uses: actions/github-script@v7
        env:
          ROLLBACK_TO: ${{ inputs.rollback-to-version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rollbackTo = `cloud-settings-${process.env.ROLLBACK_TO}`;

            // Get current --latest release (the one being rolled back)
            const { data: latest } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.info(`Rolling back from: ${latest.tag_name} → ${rollbackTo}`);

            if (latest.tag_name === rollbackTo) {
              core.setFailed(`Already at ${rollbackTo} — nothing to roll back.`);
              return;
            }

            // Replace the Rollout Status section in the release body
            const rolledBackStatus =
              `## 🚀 Rollout Status\n` +
              `us-east-1: ⏪ Rolled Back → ${rollbackTo}\n` +
              `eu-west-1: ⏪ Rolled Back → ${rollbackTo}`;

            const updatedBody = latest.body.replace(
              /## 🚀 Rollout Status[\s\S]*/,
              rolledBackStatus
            );

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: latest.id,
              body: updatedBody,
            });
            core.info(`Updated ${latest.tag_name} rollout status to Rolled Back`);

      - name: Re-point --latest to rollback target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "cloud-settings-${{ inputs.rollback-to-version }}" \
            --repo ${{ github.repository }} \
            --latest
          echo "cloud-settings-${{ inputs.rollback-to-version }} marked as --latest"
