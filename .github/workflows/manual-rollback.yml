name: Manual Rollback

# Rolls back to a previously deployed version by:
# 1. Updating the current --latest release's rollout status to "rolled-back"
# 2. Re-pointing --latest to the target rollback version

on:
  workflow_dispatch:
    inputs:
      rollback-to-version:
        description: 'Version to roll back to (e.g. 1.1.0) — must be an existing published release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      # Find the current --latest release so we know which tag to mark as rolled-back.
      - name: Get current latest release tag
        id: latest
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            core.info(`Current latest: ${data.tag_name}`);
            core.setOutput('tag', data.tag_name);

      # Mark all regions of the current latest release as rolled-back,
      # noting which version production reverted to.
      - name: Update rollout status to rolled-back
        uses: ./.github/actions/update-region-rollout-status
        with:
          tag: ${{ steps.latest.outputs.tag }}
          regions: |
            [
              {"region": "us-east-1", "status": "rolled-back"},
              {"region": "us-west-2", "status": "rolled-back"},
              {"region": "eu-west-1", "status": "rolled-back"}
            ]
          rolled-back-to: cloud-settings-${{ inputs.rollback-to-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Re-point --latest to the rollback target so the correct version is
      # shown as the current production release.
      - name: Re-point --latest to rollback target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "cloud-settings-${{ inputs.rollback-to-version }}" \
            --repo ${{ github.repository }} \
            --latest
          echo "cloud-settings-${{ inputs.rollback-to-version }} marked as --latest"
