name: Test argo-prod-deploy from-tag step (SWPBL-274392)

# Runs the exact "Resolve from-tag" script from platform-core's argo-prod-deploy against real
# tags in this repo. Each case simulates prod's registry region-info.

on:
  push:
    branches: [test/argo-from-tag-step]
    paths: [.github/workflows/test-argo-from-tag-step.yml]

permissions:
  contents: read

jobs:
  step:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "rollback: prod older, tag exists", prefix: "acct-svc-", region_info: '{"us-east-1":{"version":"9.0.1"}}', new: "9.0.3", expect: "acct-svc-9.0.1" }
          - { name: "prod older, tag missing", prefix: "acct-svc-", region_info: '{"us-east-1":{"version":"8.0.0"}}', new: "9.0.3", expect: "" }
          - { name: "same version", prefix: "acct-svc-", region_info: '{"us-east-1":{"version":"9.0.3"}}', new: "9.0.3", expect: "" }
          - { name: "prod newer (tag exists)", prefix: "acct-svc-", region_info: '{"us-east-1":{"version":"9.0.4"}}', new: "9.0.3", expect: "" }
          - { name: "no prod entry", prefix: "acct-svc-", region_info: '{}', new: "9.0.3", expect: "" }
          - { name: "first region differs", prefix: "acct-svc-", region_info: '{"us-east-1":{"version":"9.0.2"},"eu-west-1":{"version":"9.0.0"}}', new: "9.0.3", expect: "acct-svc-9.0.2" }
          - { name: "first region missing, second present", prefix: "acct-svc-", region_info: '{"eu-west-1":{"version":"9.0.1"}}', new: "9.0.3", expect: "" }
          - { name: "malformed region-info (step fails)", prefix: "acct-svc-", region_info: 'not json', new: "9.0.3", expect: "" }
          - { name: "other service prefix", prefix: "bill-svc-", region_info: '{"us-east-1":{"version":"10.0.0"}}', new: "10.0.2", expect: "bill-svc-10.0.0" }
          - { name: "prefix mismatch (acct tag via bill prefix)", prefix: "bill-svc-", region_info: '{"us-east-1":{"version":"9.0.1"}}', new: "10.0.2", expect: "" }
          - { name: "prerelease prod 9.0.3-rc1 -> 9.0.3", prefix: "acct-svc-", region_info: '{"us-east-1":{"version":"9.0.3-rc1"}}', new: "9.0.3", expect: "" }
    steps:
      - uses: actions/checkout@v6
        continue-on-error: true

      - name: Resolve from-tag
        id: from-tag
        continue-on-error: true
        shell: bash
        env:
          REGION_INFO: ${{ matrix.region_info }}
          REGION_ORDER: '[{"region":"us-east-1"},{"region":"eu-west-1"}]'
          NEW_VERSION: ${{ matrix.new }}
          TAG_PREFIX: ${{ matrix.prefix }}
        run: |
          first_region=$(echo "$REGION_ORDER" | jq -r '.[0].region')
          current_version=$(echo "$REGION_INFO" | jq -r --arg region "$first_region" '.[$region].version // empty')
          
          oldest=$(printf '%s\n%s\n' "$current_version" "$NEW_VERSION" | sort -V | head -1)
          
          # The changelog start must be older than the deployed version; otherwise leave from-tag empty.
          if [ -n "$current_version" ] && [ "$current_version" != "$NEW_VERSION" ] && [ "$oldest" = "$current_version" ]; then
            from_tag="${TAG_PREFIX}${current_version}"
          
            if git ls-remote --exit-code --tags origin "refs/tags/${from_tag}"; then
              echo "value=${from_tag}" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Could not validate that release tag ${from_tag} exists; using the default changelog start."
            fi
          else
            echo "::notice::from-tag left empty: prod version '${current_version:-none}' is not older than ${NEW_VERSION}."
          fi
          

      - name: Assert
        if: always()
        shell: bash
        env:
          GOT: ${{ steps.from-tag.outputs.value }}
          EXPECT: ${{ matrix.expect }}
          OUTCOME: ${{ steps.from-tag.outcome }}
        run: |
          echo "step outcome=${OUTCOME} from-tag='${GOT}' expected='${EXPECT}'"
          [ "$GOT" = "$EXPECT" ]

  busybox-sort:
    runs-on: ubuntu-latest
    steps:
      - name: sort -V on BusyBox (alpine)
        run: docker run --rm alpine:3.20 sh -c "printf '2.10.0\n2.9.0\n' | sort -V"
